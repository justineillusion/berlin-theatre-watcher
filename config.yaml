# Berlin Theatre Watcher — configuration (version SANS clé API)
#
# Édite librement ce fichier. Rien de secret ici (le token Telegram va dans les
# variables d'environnement / GitHub Secrets, voir .env.example).

# ---------------------------------------------------------------------------
# MOTS-CLÉS DE GOÛT
# ---------------------------------------------------------------------------
# On ne t'alerte QUE pour des spectacles avec surtitres anglais et pas complets.
# Les mots-clés affinent selon tes goûts (recherche insensible à la casse dans
# titre + lieu + langue + type + lien).

# Si un de ces mots apparaît (dans le titre, l'auteur/metteur·se en scène, etc.)
# le spectacle matche. Étoffe librement : plus la liste est riche, plus tu
# attrapes de pièces internationales. (Recherche insensible à la casse.)
keywords_love:
  # --- Metteur·ses en scène que tu aimes ---
  - Milo Rau
  - Katie Mitchell
  - Ivo van Hove
  - Simon Stone
  - Tiago Rodrigues
  - Ostermeier
  - Gisèle Vienne
  - Anne Teresa De Keersmaeker
  # --- Autrices / auteurs internationaux (souvent cités dans le "By ...") ---
  - Annie Ernaux
  - Oscar Wilde
  - George Orwell
  - Shakespeare
  - Chekhov
  - Ibsen
  - Sarah Kane
  - Caryl Churchill
  - Jon Fosse
  - Elena Ferrante
  # --- Indices de production internationale ---
  - international
  - in english          # pièces jouées en anglais

# Si un de ces mots apparaît, le spectacle est EXCLU (jamais notifié).
keywords_avoid:
  - Theaterführung   # visites guidées du théâtre
  - Führung
  - Kinder           # spectacles pour enfants
  - Familien

# true  = ne notifier QUE les spectacles qui matchent un keywords_love (ciblé,
#         peu de bruit — recommandé pour ta préférence internationale).
# false = notifier TOUS les spectacles surtitrés anglais non complets, avec ⭐
#         sur les matches (pour explorer le volume).
require_keyword_match: false

# Note presse estimée (★ sur 5) à partir de la « Kritikenrundschau » de
# nachtkritik.de, quand la pièce y a été critiquée. Estimation par lexique
# (pas de note officielle) : à lire avec la répartition 👍/😐/👎.
critics_rating: true

# Horizon : on ne montre / n'annonce que ce qui se joue MAINTENANT ou bientôt.
# Expos : déjà ouvertes, ou qui ouvrent dans ≤ horizon_expo_days jours.
# Pièces : seulement si une date tombe dans ≤ horizon_theatre_days jours (et on
# n'affiche que ces dates-là). Au-delà : gardé en base sans bruit, annoncé une
# fois en entrant dans la fenêtre. (Films : la semaine, voir cinema.yaml.)
horizon_expo_days: 7
horizon_theatre_days: 365
# Garde-fous de durée (secondes, temps réel) : une étape trop lente est coupée,
# ce qui n'a pas fini part sans (note presse / résumé / lieu sauté).
# Nachtkritik : les jobs lisent state/critics_cache.json SANS réseau ; seul le
# job de nuit critics.yml (python -m src.critics_refresh) va en ligne.
critics_budget_s: 300      # Nachtkritik en ligne (critics.yml), toutes pièces confondues
item_timeout_s: 10         # plafond PAR ITEM (page détail, traduction…) : au-delà, sauté et loggé
enrich_budget_s: 360       # pages détail + traductions des résumés
venue_timeout_s: 90        # programme d'UN lieu

# ---------------------------------------------------------------------------
# LIEUX À SCANNER (théâtres + expos)
# ---------------------------------------------------------------------------
# - name   : nom affiché (et dans /suivre du bot) — le changer = nouveau lieu
# - parser : module dans src/parsers/
# - kind   : theatre (défaut) ou expo. Les expos n'ont pas de filtre surtitres
#            ni « complet » : une alerte à l'annonce, puis un rappel « dernières
#            semaines » pour qui a cliqué ⭐ Intéressé·e.
theaters:
  - name: Schaubühne
    parser: schaubuehne
    url: https://www.schaubuehne.de/en/schedule/programme.html

  - name: Berliner Ensemble
    parser: berliner_ensemble
    url: https://www.berliner-ensemble.de/en/surtitles

  - name: Volksbühne
    parser: volksbuehne
    url: https://www.volksbuehne.berlin/en/

  # Next.js : on passe par le sitemap de chaque festival (voir parsers/festspiele.py)
  - name: Berliner Festspiele — Performing Arts Season
    parser: festspiele
    url: https://www.berlinerfestspiele.de/sitemap.xml?type=pages&nodePath=performing-arts-season

  - name: Berliner Festspiele — Theatertreffen
    parser: festspiele
    url: https://www.berlinerfestspiele.de/sitemap.xml?type=pages&nodePath=theatertreffen

  # --- Opéras & concerts (à la carte) -----------------------------------------
  # optional: true = lieu proposé dans /suivre mais PAS d'abonnement d'office
  # (géré côté Worker). Surtitres : voir src/parsers/opera.py.
  - name: Staatsoper Unter den Linden
    parser: staatsoper
    optional: true
    url: https://www.staatsoper-berlin.de/en/programme/operas/

  - name: Deutsche Oper Berlin
    parser: deutsche_oper
    optional: true
    url: https://deutscheoperberlin.de/en_EN/calendar

  # Au Schillertheater pendant les travaux du bâtiment Behrenstraße.
  - name: Komische Oper Berlin
    parser: komische_oper
    optional: true
    url: https://www.komische-oper-berlin.de/en/what/schedule/

  # Concerts : pas de filtre de langue. kind theatre faute de kind « concert »
  # côté Worker (il ne connaît que theatre / expo / cinema).
  - name: Berliner Philharmoniker
    parser: philharmonie
    optional: true
    url: https://www.berliner-philharmoniker.de/en/concerts/subscriptions-and-flex-packages/

  # --- Expos -----------------------------------------------------------------
  - name: Hamburger Bahnhof
    parser: smb
    kind: expo
    url: https://www.smb.museum/en/museums-institutions/hamburger-bahnhof/exhibitions/current/

  - name: Neue Nationalgalerie
    parser: smb
    kind: expo
    url: https://www.smb.museum/en/museums-institutions/neue-nationalgalerie/exhibitions/current/

  - name: KW Institute for Contemporary Art
    parser: kw
    kind: expo
    url: https://www.kw-berlin.de/en/exhibitions

  - name: C/O Berlin
    parser: co_berlin
    kind: expo
    url: https://co-berlin.org/en/program/exhibitions

  - name: Berlinische Galerie
    parser: berlinische_galerie
    kind: expo
    url: https://berlinischegalerie.de/en/exhibitions/

  - name: Fotografiska Berlin
    parser: fotografiska
    kind: expo
    url: https://berlin.fotografiska.com/en/exhibition

  - name: Gropius Bau
    parser: gropius_bau
    kind: expo
    url: https://www.berlinerfestspiele.de/en/gropius-bau/ausstellungen/aktuell-und-vorschau

# ---------------------------------------------------------------------------
# BOT MULTI-UTILISATEURS (amis)
# ---------------------------------------------------------------------------
# Sans effet tant que BOT_API_URL / BOT_API_TOKEN ne sont pas définis : le bot
# reste alors en mode « un seul chat » (TELEGRAM_CHAT_ID). Voir worker/README.md.
# Rappel « dernières semaines » d'une expo, N jours avant la fin, pour ceux
# qui ont cliqué ⭐ Intéressé·e (et ne l'ont pas encore vue).
expo_last_weeks_days: 14
