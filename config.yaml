# Berlin Theatre Watcher — configuration (version SANS clé API)
#
# Édite librement ce fichier. Rien de secret ici (le token Telegram va dans les
# variables d'environnement / GitHub Secrets, voir .env.example).

# ---------------------------------------------------------------------------
# MOTS-CLÉS DE GOÛT
# ---------------------------------------------------------------------------
# On ne t'alerte QUE pour des spectacles avec surtitres anglais et pas complets.
# Les mots-clés affinent selon tes goûts (recherche insensible à la casse dans
# titre + lieu + langue + type + lien).

# Si un de ces mots apparaît, le spectacle est mis en avant (⭐).
# Mets ici tes metteur·ses en scène, autrices/auteurs, pays, thèmes favoris.
keywords_love:
  - Milo Rau
  - Katie Mitchell
  - Ivo van Hove
  - Simon Stone
  - Tiago Rodrigues
  - Annie Ernaux
  - Ostermeier
  - international

# Si un de ces mots apparaît, le spectacle est EXCLU (jamais notifié).
keywords_avoid:
  - Theaterführung   # visites guidées
  - tour
  - Kinder           # spectacles pour enfants
  - Familien

# true  = ne notifier QUE les spectacles qui matchent un keywords_love.
# false = notifier TOUS les spectacles surtitrés anglais non complets,
#         en mettant simplement en avant ceux qui matchent (recommandé au début
#         pour voir ce que ça remonte, puis passe à true si trop de bruit).
require_keyword_match: false

# ---------------------------------------------------------------------------
# THÉÂTRES À SCANNER
# ---------------------------------------------------------------------------
theaters:
  - name: Berliner Ensemble
    parser: berliner_ensemble
    url: https://www.berliner-ensemble.de/en/surtitles

  - name: Volksbühne
    parser: volksbuehne
    url: https://www.volksbuehne.berlin/en/

  # Schaubühne : programme chargé en JavaScript -> pas exploitable sans LLM ni
  # navigateur headless. Désactivée pour l'instant. Voir README > Limites.
  # - name: Schaubühne
  #   parser: schaubuehne
  #   url: https://www.schaubuehne.de/en/programme/index.html
