name: Scan Berlin theatres

on:
  schedule:
    # Tous les jours à 08:00 UTC (~10:00 heure de Berlin).
    - cron: "0 8 * * *"
  workflow_dispatch: {}   # bouton "Run workflow" pour tester à la main

permissions:
  contents: write          # pour committer state/seen.json

concurrency:
  group: theatre-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run scanner
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m src.main

      - name: Persist state
        run: |
          git config user.name  "theatre-watcher-bot"
          git config user.email "actions@github.com"
          git add state/seen.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update seen state [skip ci]"
            git push
          else
            echo "Pas de changement d'état."
          fi
