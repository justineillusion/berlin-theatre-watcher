name: Scan Berlin theatres

on:
  schedule:
    # Objectif : recevoir les alertes le MATIN à Berlin.
    #
    # Les crons GitHub sont "best effort" et arrivent très en retard : réglé à
    # 08:23 UTC, ce workflow partait en pratique entre 11:51 et 16:13 UTC, soit
    # l'après-midi voire le soir à Berlin. On avance donc le tir, et on pose
    # deux créneaux plutôt qu'un : GitHub saute parfois purement et simplement
    # une exécution planifiée.
    #
    # Deux exécutions ne produisent PAS de doublon : l'état (state/seen.json)
    # mémorise les dates déjà annoncées, donc le second passage n'envoie que ce
    # que le premier n'a pas vu. Le scan est idempotent.
    - cron: "17 5 * * *"    # 07:17 Berlin l'été, 06:17 l'hiver
    - cron: "17 7 * * *"    # filet de sécurité si le premier est sauté
  workflow_dispatch: {}   # bouton "Run workflow" pour tester à la main

permissions:
  contents: write          # pour committer state/seen.json + state/muted.json

concurrency:
  group: theatre-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25   # garde-fou : jamais un job de plusieurs heures
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Bot multi-utilisateurs (worker/) : si ces secrets existent, les notifs
          # partent à chaque ami selon ses choix ; sinon, mode « un seul chat ».
          BOT_API_URL: ${{ secrets.BOT_API_URL }}
          BOT_API_TOKEN: ${{ secrets.BOT_API_TOKEN }}
        run: python -m src.main

      - name: Persist state
        if: always()
        run: |
          git config user.name  "theatre-watcher-bot"
          git config user.email "actions@github.com"
          git add state/seen.json
          # Boutons « 🔕 Ne plus suivre » : pièces masquées + offset getUpdates.
          if [ -f state/muted.json ]; then git add state/muted.json; fi
          if [ -f state/critics_cache.json ]; then git add state/critics_cache.json; fi
          if [ -f state/summary_cache.json ]; then git add state/summary_cache.json; fi
          if [ -f state/press_items.json ]; then git add state/press_items.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "chore: update seen/muted state [skip ci]"
            git pull --rebase -X theirs origin main || git rebase --abort
            git push
          else
            echo "Pas de changement d'état."
          fi
