name: Ouverture des ventes (1er du mois)

on:
  schedule:
    # Ouverture des ventes (reportée au jour ouvré suivant si dimanche/férié) :
    #   - Schaubühne : le 1er à 11:00, pour le mois suivant
    #   - Volksbühne : 1er jour ouvré, pour le mois suivant (heure non précisée)
    #   - Berliner Ensemble : le 3 à 10:00, fenêtre glissante d'~4 semaines
    # Les places des pièces courues partent en quelques heures : le scan
    # quotidien du matin passe AVANT l'ouverture et ne les verrait que le
    # lendemain. Le cron tourne du 1er au 6 ; le job sort aussitôt si ce
    # n'est pas un jour d'ouverture.
    #
    # Les crons GitHub arrivent souvent avec des heures de retard : on ne vise
    # donc pas l'heure d'ouverture : on démarre tôt et le job ATTEND lui-même
    # l'ouverture avant de scanner toutes les 10 min pendant une heure.
    - cron: "3 5 1-6 * *"   # 07:03 Berlin l'été, 06:03 l'hiver
  workflow_dispatch: {}     # bouton "Run workflow" pour tester à la main

permissions:
  contents: write           # pour committer state/seen.json

concurrency:
  group: theatre-scan       # même groupe que le scan quotidien : un seul writer de seen.json
  cancel-in-progress: false

jobs:
  presale:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Jour d'ouverture ?
        id: sale
        env:
          TZ: Europe/Berlin
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import datetime as dt
          # Fériés fixes à Berlin (les fériés mobiles tombent rarement du 1er au 6).
          FIXED = {(1, 1), (5, 1), (10, 3), (12, 25), (12, 26)}
          today = dt.date.today()
          def sale_day(day):
              d = today.replace(day=day)
              while d.weekday() == 6 or (d.month, d.day) in FIXED:
                  d += dt.timedelta(days=1)
              return d
          if today == sale_day(1):
              print("hour=11")        # Schaubühne + Volksbühne
          elif today == sale_day(3):
              print("hour=10")        # Berliner Ensemble
          else:
              print("hour=")
          PY
          cat "$GITHUB_OUTPUT"

      - name: Scans rapprochés pendant l'heure d'ouverture (Berlin)
        if: steps.sale.outputs.hour != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TZ: Europe/Berlin
          HOUR: ${{ steps.sale.outputs.hour }}
        run: |
          start=$(date -d "today ${HOUR}:00" +%s)
          end=$(( start + 3600 ))
          now=$(date +%s)
          if [ "$now" -lt "$start" ]; then
            echo "Attente jusqu'à ${HOUR}:00 Berlin ($(( (start - now) / 60 )) min)…"
            sleep $(( start - now ))
          fi
          # Au moins un passage, même si GitHub nous a lancés après la fenêtre.
          while :; do
            echo "=== Scan $(date +%H:%M) ==="
            python -m src.main || echo "⚠️ scan en échec, on réessaie au prochain créneau"
            [ "$(date +%s)" -ge "$end" ] && break
            sleep 600
          done

      - name: Persist state
        if: always() && steps.sale.outputs.hour != ''
        run: |
          git config user.name  "theatre-watcher-bot"
          git config user.email "actions@github.com"
          git add state/seen.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update seen state [skip ci]"
            git push
          else
            echo "Pas de changement d'état."
          fi
