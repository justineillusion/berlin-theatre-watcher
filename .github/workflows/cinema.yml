name: Ciné de la semaine

on:
  schedule:
    # Dimanche matin : 05:17 UTC = 06:17 à Berlin l'hiver (CET), 07:17 l'été.
    # Minute « bizarre » exprès : les crons GitHub à l'heure pile sont souvent
    # retardés, et parfois sautés -> second créneau 07:17 UTC (--backup) qui
    # n'envoie rien si le récap de la semaine est déjà parti (mémorisé par le Worker).
    - cron: "17 5 * * 0"
    - cron: "17 7 * * 0"
  workflow_dispatch:      # bouton "Run workflow" pour tester à la main
    inputs:
      only:
        description: "Cinémas seulement (noms de cinema.yaml, séparés par des virgules) ; vide = tous"
        required: false
        default: ""

permissions:
  contents: read           # le récap ciné n'écrit rien dans le repo

concurrency:
  group: cinema-weekly
  cancel-in-progress: false

jobs:
  cinema:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Envoyer le récap ciné
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Bot multi-utilisateurs : chaque ami reçoit les cinémas qu'il suit
          # (/suivre). Sans ces secrets : tout part sur TELEGRAM_CHAT_ID.
          BOT_API_URL: ${{ secrets.BOT_API_URL }}
          BOT_API_TOKEN: ${{ secrets.BOT_API_TOKEN }}
        # Bouton « Run workflow » : --force (renvoie même si déjà parti cette semaine).
        run: >-
          python -m src.cinema
          ${{ github.event.schedule == '17 7 * * 0' && '--backup' || '' }}
          ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}
          ${{ inputs.only != '' && format('--only "{0}"', inputs.only) || '' }}
