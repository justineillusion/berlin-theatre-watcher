name: Ciné de la semaine

on:
  schedule:
    # Lundi 06:17 UTC = 07:17 à Berlin l'hiver (CET), 08:17 l'été (CEST).
    # Minute « bizarre » exprès : les crons GitHub à l'heure pile sont souvent
    # retardés. Les schedules restent "best effort".
    - cron: "17 6 * * 1"
  workflow_dispatch: {}   # bouton "Run workflow" pour tester à la main

permissions:
  contents: read           # le récap ciné n'écrit rien dans le repo

concurrency:
  group: cinema-weekly
  cancel-in-progress: false

jobs:
  cinema:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Envoyer le récap ciné
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m src.cinema
