<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Berlin Encore!</title>
<meta name="theme-color" content="#ffffff">
<meta name="description" content="Théâtre surtitré, expos et ciné en VO à Berlin, avec tes amis.">
<link rel="manifest" href="/app/manifest.webmanifest">
<link rel="apple-touch-icon" href="/app/icon-180.png">
<link rel="icon" type="image/png" href="/app/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Encore!">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
:root{
  /* Noir sur blanc, police moderne (Manrope). Accents rares : rouge (actions, « ! » du nom), or (étoiles). */
  --bg:#ffffff; --card:#f2f2f5; --ink:#111214; --muted:#686e75;
  --line:#e6e6ea;
  --velvet:#d7263d; --velvet-ink:#ffffff; --gold:#e0a100; --gold-soft:#fff6dc;
  --ok:#2f9e5b; --sans:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; --serif:var(--sans);
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
body{padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
button{font-family:inherit;color:inherit;cursor:pointer}

/* En-tête : le nom comme sur l'affiche, puis onglets et filtres collants. */
.mast{padding:14px 16px 8px;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:baseline;gap:8px;line-height:1}
.brand small{display:none}
.brand b{font:800 24px var(--sans);letter-spacing:-.03em}
.brand b i{font-style:normal;color:var(--velvet)}
.mast time{font:500 13px var(--sans);color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.top{position:sticky;top:0;z-index:3;background:var(--bg);padding:4px 12px 8px;border-bottom:1px solid var(--line)}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);border-block:2px solid var(--ink);margin:0 -12px}

.tab{border:0;border-right:2px solid var(--ink);background:var(--bg);padding:10px 4px;font:800 12.5px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink);border-radius:0}
.tab:last-child{border-right:0}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.filters{display:flex;gap:6px;overflow-x:auto;padding:8px 12px 0;margin:0 -12px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--ink);background:var(--bg);font:700 12px var(--sans);letter-spacing:.03em;text-transform:uppercase;padding:6px 8px;border-radius:0;white-space:nowrap}
/* Types : 4 cases égales sur toute la largeur, tout tient sur un téléphone. */
#kinds{gap:2px;overflow:visible;background:var(--velvet);margin-top:8px;padding:0 8px}
#kinds .chip{flex:1 1 auto;text-align:center;border:0;background:none;box-shadow:none;border-radius:0;color:var(--velvet-ink);opacity:.72;border-bottom:3px solid transparent;padding:11px 2px 8px}
#kinds .chip[aria-pressed="true"]{background:none;color:var(--velvet-ink);opacity:1;border-bottom-color:var(--velvet-ink);box-shadow:none}
.onb{margin:14px 16px 4px;padding:14px 16px;border-left:3px solid var(--velvet);background:var(--card);font-size:14.5px;line-height:1.4;display:flex;gap:10px;align-items:flex-start}
.onb div{flex:1}.onb b{display:block;margin-bottom:2px}.onb .go{margin-top:8px;border:0;background:none;padding:0;font:800 13px var(--sans);color:var(--velvet);text-decoration:underline;text-underline-offset:4px;cursor:pointer}
.onb .x{border:0;background:none;font-size:16px;color:var(--muted);cursor:pointer;padding:0 2px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
/* Temporel : du texte, pas des boîtes ; le choix actif est souligné. */
#whens{gap:18px;padding-top:10px}
#whens .chip{border:0;background:none;padding:2px 0;font:600 14px var(--sans);letter-spacing:0;text-transform:none;color:var(--muted)}
#whens .chip[aria-pressed="true"]{background:none;color:var(--ink);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:5px;box-shadow:none}

/* Liste : un jour = un intertitre en italique, une ligne = heure | titre. */
.day{display:flex;align-items:baseline;gap:8px;padding:20px 16px 6px;font:800 17px var(--sans);letter-spacing:-.01em;color:var(--ink)}
.day span{font:500 14px var(--sans);color:var(--muted)}
.day em{font:600 11px var(--sans);font-style:normal;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.item{margin:0 10px;border-radius:0}
.item.open{background:var(--bg);border:2px solid var(--ink);box-shadow:5px 5px 0 var(--ink);margin:8px 14px 12px 10px}
.item.soldout:not(.open) .row{opacity:.42}.item.soldout .when small{color:var(--velvet);font-weight:800;text-transform:uppercase;letter-spacing:.04em}
em.sold{font-style:normal;font-weight:800;font-size:11px;color:var(--velvet);text-transform:uppercase;letter-spacing:.04em}.detail s{color:var(--muted)}
#whens .soldtoggle{margin-left:auto}
/* Réglages → Mes lieux : quartiers (un à la fois), filtrent la liste des lieux. */
/* Sous-onglets des Réglages : du texte, pas des cases ; l'actif souligné de rouge. */
.subtabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));grid-auto-flow:column;margin:2px -18px 10px;border-bottom:1px solid var(--line)}
.subtabs .chip{border:0;background:none;text-align:center;padding:12px 4px 10px;font:700 12.5px var(--sans);letter-spacing:.08em;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.subtabs .chip[aria-pressed="true"]{background:none;color:var(--ink);border-bottom-color:var(--velvet)}
.subtabs .chip i{font-style:normal;background:var(--velvet);color:#fff;border-radius:9px;padding:0 6px;margin-left:6px;font-size:11px}
.cal{color:var(--velvet);font-weight:600;text-decoration:none;white-space:nowrap}
.av{width:22px;height:22px;border-radius:50%;object-fit:cover;vertical-align:-6px;margin:0 1px;box-shadow:0 0 0 1px var(--line)}
img.avbig,img.avmid,img.av{background:#fff;box-shadow:0 0 0 1px var(--line)}
.avbig,.avmid{width:52px;height:52px;border-radius:50%;object-fit:cover;flex:none;display:inline-flex;align-items:center;justify-content:center;background:var(--line);color:var(--muted);font:700 20px var(--sans)}
.avmid{width:30px;height:30px;font-size:13px;margin-right:10px}
.fline.photo>div:nth-child(2){flex:1}
.fline .avbig.none,.fline .avmid.none{display:inline-flex;align-items:center;justify-content:center;font:800 22px/1 var(--sans);letter-spacing:-.02em;text-transform:uppercase}
.fline .avmid.none{font-size:14px;margin-right:10px}
.none.c0{background:var(--velvet);color:#fff}
.none.c1{background:var(--ink);color:var(--bg)}
.none.c2{background:var(--bg);color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.none.c3{background:var(--bg);color:var(--velvet);box-shadow:inset 0 0 0 2px var(--velvet)}
.none.c4{background:#2b59c3;color:#fff}
.none.c5{background:var(--gold);color:#111214}
.none.c6{background:#1f8a5b;color:#fff}
.fname{display:flex;align-items:center;border:0;background:none;padding:0;text-align:left;font:inherit;color:inherit;cursor:pointer}
.fname b{text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:4px}
.fhead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:6px 0 4px}
.fhead h2{font:800 22px var(--sans);letter-spacing:-.02em;margin:0}
.invlink{display:block;font:500 13.5px var(--sans);background:var(--card);padding:10px 12px;margin:8px 0;word-break:break-all;user-select:all}
/* Quartier : un petit menu déroulant, discret (sélecteur natif sur téléphone). */
.areasel{display:flex;align-items:center;gap:6px;margin:4px 0 6px;font:500 13.5px var(--sans);color:var(--muted)}
.areasel select{appearance:none;-webkit-appearance:none;border:0;background:none;font:700 13.5px var(--sans);color:var(--ink);padding:2px 16px 2px 0;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);
  background-position:calc(100% - 7px) 55%,calc(100% - 3px) 55%;background-size:4px 4px;background-repeat:no-repeat;cursor:pointer}
.row{display:grid;grid-template-columns:58px minmax(0,1fr) auto;gap:12px;align-items:start;padding:10px 8px;border:0;background:none;width:100%;text-align:left}
.when{font:700 15.5px var(--sans);font-variant-numeric:tabular-nums;text-align:right;padding-top:1px;line-height:1.1}
.when small{display:block;font:500 12px var(--sans);color:var(--muted);margin-top:3px}
.t{font:700 16px/1.3 var(--sans);letter-spacing:-.005em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.v{font-size:14px;color:var(--muted);margin-top:2px}
.v .sc{color:var(--ink);font-weight:700;white-space:nowrap}
.sc.link{text-decoration:underline;text-decoration-color:var(--gold);text-underline-offset:3px;cursor:pointer}
.venue{margin:14px 16px 2px;padding-top:10px;border-top:2px solid var(--ink);font:800 12.5px var(--sans);letter-spacing:.08em;text-transform:uppercase}
.badge.rescue{border:1.5px solid var(--ink);padding:3px 8px;font-weight:800;color:var(--ink);opacity:1}.dismissed .item:not(.open) .row .rescue{opacity:1}
.day.dim{color:var(--muted);border-top:1px solid var(--line);margin-top:18px}.day .fold{margin-left:auto;border:0;background:none;padding:0;font:600 13.5px var(--sans);color:var(--muted);text-decoration:underline;text-underline-offset:3px}.dismissed .item:not(.open) .row > :not(.rescue){opacity:.42}
.hurry{color:var(--velvet);font-weight:700;white-space:nowrap}
.more{display:block;margin:0 0 4px 76px;border:0;background:none;padding:6px 0;font:700 13.5px var(--sans);color:var(--ink);text-decoration:underline;text-underline-offset:4px}
.v .k{color:var(--gold)}
.logo{width:24px;height:24px;object-fit:contain;vertical-align:middle;border-radius:3px}
.set .line .logo{width:20px;height:20px;margin-right:8px;flex:none}.set .line > div{display:flex;align-items:center}
.badge{font-size:15px;padding-top:2px}
.social{font-size:14px;color:var(--ink);margin-top:6px;display:flex;flex-wrap:nowrap;white-space:nowrap;overflow:hidden;align-items:center;column-gap:14px;row-gap:6px}
.social .sp{display:inline-flex;align-items:center;gap:6px;line-height:22px}
.social .ostar,.social .stack,.social .fnames,.social .av{vertical-align:baseline;margin:0}
.social .stack .face{margin-left:-6px}.social .stack .face:first-child{margin-left:0}
.plan{border:0;background:none;padding:0 0 0 4px;font:700 13px var(--sans);color:var(--velvet);cursor:pointer;white-space:nowrap}
.social .av{width:22px;height:22px;vertical-align:middle}
.stack{display:inline-flex;align-items:center;vertical-align:middle;margin-right:6px}
.stack .face{display:inline-flex;border-radius:50%;box-shadow:0 0 0 2px var(--bg);margin-left:-6px}
.stack .face:first-child{margin-left:0}
.stack .av.none{width:22px;height:22px;font-size:10.5px}
.fnames{color:var(--muted);font-size:13px;vertical-align:middle;overflow:hidden;text-overflow:ellipsis}
.social .sp:last-child{min-width:0}
.face[data-face]{cursor:pointer}
.seenp{display:inline-flex;align-items:center;gap:3px}
.rv{color:#a37700;font-weight:800}
.av.none{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;font:800 10px var(--sans);vertical-align:-5px}
.ostar{font-size:14px;line-height:1}
.badge.disc{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;font-size:15px;line-height:1;padding:0;margin-top:2px;background:var(--card);box-shadow:inset 0 0 0 1.5px var(--line)}
.badge.disc.booked{background:#fff;box-shadow:inset 0 0 0 1.5px var(--velvet)}
.badge.disc.seen{background:#fff;box-shadow:inset 0 0 0 1.5px var(--ok)}
.badge.disc.rate{font:800 11.5px var(--sans);color:#8a6400;background:var(--gold-soft);box-shadow:inset 0 0 0 1.5px var(--gold);white-space:nowrap}
.badge.mystar{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:var(--gold-soft);box-shadow:inset 0 0 0 1.5px var(--gold);font-size:17px;line-height:1;padding:0;margin-top:2px}
.more{color:var(--muted);font-size:12.5px;white-space:nowrap}
.cropbg{position:fixed;inset:0;background:rgba(14,15,17,.55);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.cropbox{background:var(--bg);padding:20px;display:grid;gap:16px;justify-items:center;width:100%;max-width:320px}
.cropview{width:240px;height:240px;border-radius:50%;overflow:hidden;position:relative;touch-action:none;cursor:grab;background:var(--card);box-shadow:0 0 0 2px var(--ink)}
.cropview img{position:absolute;left:50%;top:50%;max-width:none;user-select:none;-webkit-user-drag:none}
.cropz{display:flex;align-items:center;gap:10px;width:100%;font:700 18px var(--sans);color:var(--muted)}
.cropz input{flex:1;accent-color:var(--velvet)}
.cropbox .acts{justify-content:center}
.tab .tabn{display:inline-block;min-width:17px;height:17px;margin-left:6px;border-radius:9px;background:var(--velvet);color:#fff;font:800 10.5px/17px var(--sans);font-style:normal;text-align:center;padding:0 4px;vertical-align:1px;letter-spacing:0}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px 16px}
.kpi{border:1.5px solid var(--line);padding:10px}.kpi b small{font-size:13px;color:var(--muted);font-weight:600}
.vbars{padding:4px 0 8px}.vbars div{display:grid;grid-template-columns:1fr 90px 28px;gap:8px;align-items:center;font-size:13px;padding:3px 0}.vbars span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.vbars i{display:block;height:8px;background:var(--velvet);min-width:2px}.vbars b{text-align:right}.kpi b{display:block;font:800 22px var(--sans)}.kpi span{font-size:12px;color:var(--muted)}
.wk{display:flex;align-items:flex-end;gap:6px;padding:8px 16px;overflow-x:auto}.wk div{display:flex;flex-direction:column;align-items:center;min-width:30px;font-size:11px}
.wk i{display:block;width:16px;background:var(--velvet)}.wk small{color:var(--muted)}
.adm{padding:4px 16px;margin:0;color:var(--muted);font-size:14px}
.au{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;padding:10px 16px;border-bottom:1px solid var(--line);font-size:14px}
.au span,.au small{color:var(--muted)}.au em{color:var(--velvet);font-style:normal;font-size:12px}.au.off{opacity:.55}
.aun{display:flex;flex-direction:column;text-align:right}
.sugg{margin-top:26px}.sugg summary{cursor:pointer;color:var(--muted);font-size:13.5px;padding:8px 0;list-style:none}.sugg summary::-webkit-details-marker{display:none}.sugg summary::after{content:" ›"}
.note-row{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.note-row.unread{box-shadow:inset 3px 0 0 var(--velvet)}
.note-row small{display:block;color:var(--muted);font-size:12px;margin-top:3px}
.note-row .quote{margin-top:4px;font-size:14px}
.note-row .avmid.none{display:inline-flex;align-items:center;justify-content:center;font:800 14px var(--sans);flex:none}
.note-row .avmid{flex:none;margin:0}
.fbox{display:grid;gap:8px;margin-top:26px;padding-top:14px;border-top:1px solid var(--line)}
.fbox textarea{resize:vertical;font:inherit}
.soldfoot{display:flex;justify-content:center;padding:22px 0 6px}
.soldfoot .chip{border:0;background:none;text-transform:none;letter-spacing:0;font:600 14px var(--sans);color:var(--muted);text-decoration:underline;text-underline-offset:4px;text-decoration-color:var(--line)}
.item .quote.fv{margin-top:6px;font-size:14px}

/* Critique : visible tout de suite, en citation. */
.review{margin-top:6px;display:flex;flex-direction:column;gap:2px}
.stars{color:var(--gold);letter-spacing:.06em;font-size:15px}
.stars i{font-style:normal;color:var(--line)}
.quote{font:italic 500 15px/1.45 var(--sans);color:var(--ink);overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.quote.full{-webkit-line-clamp:unset;display:block}
.noreview{font-size:14px;color:var(--velvet)}

.detail{padding:0 14px 14px 72px;display:grid;grid-template-columns:minmax(0,1fr);gap:8px;font-size:15px;overflow-wrap:anywhere}
@media (max-width:420px){.detail{padding-left:18px}}
.badge.rate{font:600 13px var(--sans);color:var(--gold);white-space:nowrap}
.who{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.who .lbl{font-size:12.5px;color:var(--muted);margin-right:2px}
.sent{font-size:13px;color:var(--ok)}
.note{width:100%;border:1.5px solid var(--ink);border-radius:0;padding:9px 10px;font:500 15px var(--sans);background:var(--bg);color:var(--ink)}
.review-in{resize:vertical;margin:8px 0 2px;line-height:1.4}
.note:focus{outline:2px solid var(--velvet);outline-offset:0}
.detail .m{color:var(--muted);font-size:14px}
.detail .syn{font:400 15px/1.5 var(--sans)}
.sect{font:600 11.5px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin-top:4px}
.mine{background:var(--gold-soft);border-left:3px solid var(--gold);border-radius:0;padding:10px 12px;display:grid;gap:4px}
.friend{display:grid;gap:1px;padding-left:10px;border-left:2px solid var(--line)}
.friend b{font:600 14px var(--sans)}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.act{border:1.5px solid var(--ink);background:var(--bg);font:700 13px var(--sans);letter-spacing:.02em;padding:8px 12px;border-radius:0;text-decoration:none;color:var(--ink)}
.act.on{background:var(--velvet);border-color:var(--velvet);color:var(--velvet-ink);box-shadow:3px 3px 0 var(--ink)}
.act.rate{padding:7px 9px;color:var(--gold);letter-spacing:.06em}
.act.rate.on{background:var(--gold);border-color:var(--gold);color:var(--card)}
.gone{opacity:.3;filter:grayscale(1);transition:opacity .35s}
.empty,.msg{padding:56px 28px;text-align:center;color:var(--muted);font:italic 500 16px var(--serif)}
.why{margin:22px 0 8px;padding:12px 14px;border-left:3px solid var(--ink);background:var(--card);font-size:13.5px;line-height:1.45;color:var(--muted)}.why p{margin:0 0 6px}.why p:last-child{margin:0}.why b{color:var(--ink)}
.set{padding:8px 18px}
.set .line{padding:12px 0;border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left;display:flex;justify-content:space-between;gap:12px;font:400 14.5px var(--sans)}
.set .line span{color:var(--muted)}
.set .line .dist{display:block;font-size:12.5px;color:var(--muted);margin-top:1px}
.set .line.on span{color:var(--ok)}
.fline{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.fline b{font-weight:700}.fline span{display:block;font-size:13px;color:var(--muted)}
.hint{color:var(--muted);font-size:13px;margin-top:14px}
.login{max-width:420px;margin:0 auto;padding:40px 24px;display:grid;gap:14px;text-align:left}
.login p{margin:0;color:var(--muted)}.login .act{text-align:center;padding:12px 14px;font-size:15px}
.landing .mast{display:none}
.landing .bill{filter:blur(.4px);opacity:.75;-webkit-mask-image:linear-gradient(#000 60%,transparent);mask-image:linear-gradient(#000 60%,transparent);pointer-events:none;user-select:none;margin-top:6px}
.hero{color:var(--ink);padding:18px 24px 0;position:relative}
.hero .lpick{position:absolute;top:14px;right:16px;display:flex;gap:2px;z-index:1}
.lpick button{border:0;background:none;font:700 12px var(--sans);letter-spacing:.08em;color:var(--muted);padding:4px 6px;cursor:pointer}
.lpick button.on{color:var(--ink);box-shadow:inset 0 -2px 0 var(--velvet)}
.wm{margin-top:34px;line-height:.86}
.wm small{display:block;font:800 15px var(--sans);letter-spacing:.42em;text-transform:uppercase;color:var(--ink);margin-bottom:10px}
.wm b{display:block;font:800 clamp(62px,19vw,92px)/.86 var(--sans);letter-spacing:-.055em}
.wm b i{font-style:normal;color:var(--velvet)}
.hero .tag{font:500 19px/1.35 var(--sans);color:var(--muted);margin:18px 0 0;max-width:24ch}
.bill{border-top:1px solid var(--line)}
.billt{display:block;font:800 11.5px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--velvet);padding:10px 0 4px}
.billrow{display:grid;grid-template-columns:96px 1fr;column-gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.billrow .bw{grid-row:span 2;font:700 12px/1.6 var(--sans);color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.billrow .bt{font:700 16px/1.25 var(--sans);color:var(--ink)}
.billrow .bv{font:500 13px var(--sans);color:var(--muted)}
.login{padding:22px 20px 40px;gap:22px}
.lform{display:grid;gap:18px;padding:22px 0 6px;border-top:2px solid var(--ink)}
.lform .note{background:transparent;border:0;border-bottom:1.5px solid var(--ink);border-radius:0;padding:10px 0;font:500 18px var(--sans);color:var(--ink);box-shadow:none;outline:none}
.lform .note:focus{border-bottom-color:var(--velvet)}
.lform .note::placeholder{color:#a0a5ab}
.lform .act{box-shadow:none!important;border-radius:0;font:800 13px var(--sans);letter-spacing:.12em;text-transform:uppercase;padding:15px 14px}
.lform .act:not(.on){border:0;background:none;padding:4px;color:var(--muted);letter-spacing:.06em}
.lform .hint{margin:0}
.lform .pkhi{margin:-8px 0 0;color:var(--muted);font-size:15px}
.lform .lnk{border:0;background:none;padding:2px 0;justify-self:center;font:600 14px var(--sans);color:var(--muted);text-decoration:underline;text-underline-offset:4px;cursor:pointer}
.hp{position:absolute!important;left:-9999px;width:1px;height:1px;opacity:0}
.what{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.what li{display:flex;gap:12px;align-items:baseline;font:500 15px/1.35 var(--sans);color:var(--ink)}
.what li::before{content:"";width:12px;height:2px;background:var(--velvet);flex:none;align-self:center}
.sign{text-align:center;font:700 11.5px var(--sans)!important;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.ftitle{font:800 12px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--velvet)}
.inviter{display:flex;align-items:center;gap:0;font:700 16px var(--sans)}
.inviter .avmid{width:40px;height:40px;margin-right:12px}
.inviter .avmid.none{display:inline-flex;align-items:center;justify-content:center;font:800 16px var(--sans)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;font:600 14px var(--sans);max-width:calc(100% - 32px);z-index:9}
.cat{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:18px;padding:10px 0 4px;border-top:2px solid var(--ink)}
.cat b{font:800 12.5px var(--sans);letter-spacing:.08em;text-transform:uppercase}.cat .act{padding:5px 10px;font-size:12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

function next(x) {

  if (x.kind === "expo") return x.start && x.start > TODAY ? x.start : TODAY;

  return (x.dates || []).slice().sort().find((d) => d.slice(0, 10) >= TODAY) || null;

/** Lignes utiles de la fiche du bot (HTML Telegram) : lieu/salle, auteur, langue, critiques presse, résumé. */
function facts(x) {
  const txt = (x.text || "").replace(/<br\s*\/?>/g, "\n").replace(/<[^>]*>?/g, "");
  const d = document.createElement("textarea"); d.innerHTML = txt; const lines = d.value.split("\n").map((l) => l.trim());
  const pick = (p) => lines.filter((l) => l.startsWith(p));
  // Films : « (2026, Réalisateur) » sur la 1re ligne, « ★ 6,9 SC » / « ★ 3,8 LB » sur une ligne à part.
  const credits = x.kind === "film" ? ((lines[0] || "").match(/\(([^)]*\d{4}[^)]*)\)\s*$/) || [])[1] || "" : "";
  const rating = lines.find((l) => /^★\s*\d/.test(l)) || "";
  const ratingUrl = ((x.text || "").match(/<a href="(https?:[^"]+)"[^>]*>\s*★\s*\d[^<]*<\/a>/) || [])[1] || "";
  const nkUrl = ((x.text || "").match(/<a href="(https?:[^"]+)"[^>]*>\s*Nachtkritik/) || [])[1] || "";
  return { ratingUrl, nkUrl, meta: [...(credits ? ["🎬 " + credits] : []), ...pick("📍"), ...pick("✍️"), ...pick("🗣"), ...pick("📰")],
           rating, syn: pick("📝").map((l) => l.replace(/^📝\s*/, "")).join(" ").slice(0, 420) };
}

async function api(path, extra = {}) {
  const headers = { "content-type":"application/json" };
  if (WEB && TOKEN) headers.authorization = "Bearer " + TOKEN;
  const r = await fetch(API_BASE + "/app/api/" + path, { method:"POST", headers, body: JSON.stringify({ ...(INIT ? { initData: INIT } : {}), focus: FOCUS, ...extra }) });
  const j = await r.json().catch(() => ({}));
  // Opéras et concerts (lieux « à la carte ») : rangés à part, filtre « Musique ».
  if (j && Array.isArray(j.items) && Array.isArray(j.venues)) {
    const opt = new Set(j.venues.filter((v) => v.optional).map((v) => v.id));
    j.items.forEach((x) => { if (opt.has(x.venue_id)) x.kind = "music"; });
  }
  if (WEB && r.status === 401 && !path.startsWith("login/") && path !== "logout") { setToken(""); showLogin(); }
  if (!r.ok) throw Object.assign(new Error(j.error || r.status), { info: j, status: r.status });
  return j;
}

function exposByVenue(expos) {

  const groups = new Map();
  for (const x of expos) (groups.get(x.venue) || groups.set(x.venue, []).get(x.venue)).push(x);
  const score = (x) => ((x.me && (x.me.star || x.me.booked)) || (x.friends || []).some((p) => p.star || p.booked) ? 2 : 0)
    + (/📰[^\n]*\d+\s*(source|critique|review)/i.test(x.text || "") ? 1 : 0) + (x.starred ? 1 : 0);
  let h = "";
  for (const [venue, xs] of [...groups].sort((a, b) => (order.get(a[0]) ?? 99) - (order.get(b[0]) ?? 99))) {
    xs.sort((a, b) => score(b) - score(a) || (a.end || "9").localeCompare(b.end || "9"));

  }
  return h;
}

/** Photo : on choisit le cadrage (glisser pour centrer, curseur pour zoomer), puis 256 px JPEG envoyés. */
async function savePhoto(file) {

  if (!file) { st.busy = true; try { S = await api("photo", { photo: null }); } catch { notify(T.error); } st.busy = false; return void render(); }

function cropper(img) {
  const V = 240, W = img.naturalWidth, H = img.naturalHeight, base = V / Math.min(W, H);
  const c = { zoom: 1, x: 0, y: 0 };
  const wrap = document.createElement("div"); wrap.className = "cropbg";
  wrap.innerHTML = `<div class="cropbox" role="dialog" aria-label="${esc(T.photoT)}">
    <b class="ftitle">${esc(T.cropT)}</b>
    <div class="cropview" id="cropview"><img id="cropimg" src="${img.src}" alt="" draggable="false"></div>
    <label class="cropz"><span>−</span><input id="cropzoom" type="range" min="1" max="4" step="0.01" value="1"><span>+</span></label>
    <div class="acts"><button class="act" data-cropcancel="1">${esc(T.cancel)}</button><button class="act on" data-cropsave="1">${esc(T.save)}</button></div></div>`;
  document.body.appendChild(wrap);
  const el = wrap.querySelector("#cropimg"), view = wrap.querySelector("#cropview");
  const clamp = () => {
    const s = base * c.zoom, mx = Math.max(0, (W * s - V) / 2), my = Math.max(0, (H * s - V) / 2);
    c.x = Math.min(mx, Math.max(-mx, c.x)); c.y = Math.min(my, Math.max(-my, c.y));
    el.style.width = `${W * s}px`; el.style.height = `${H * s}px`;
    el.style.transform = `translate(calc(-50% + ${c.x}px), calc(-50% + ${c.y}px))`;
  };
  clamp();
  let drag = null;
  view.addEventListener("pointerdown", (e) => { drag = { px: e.clientX, py: e.clientY, x: c.x, y: c.y }; view.setPointerCapture(e.pointerId); });
  view.addEventListener("pointermove", (e) => { if (!drag) return; c.x = drag.x + e.clientX - drag.px; c.y = drag.y + e.clientY - drag.py; clamp(); });
  view.addEventListener("pointerup", () => { drag = null; });
  view.addEventListener("wheel", (e) => { e.preventDefault(); c.zoom = Math.min(4, Math.max(1, c.zoom * (e.deltaY < 0 ? 1.06 : 0.94))); wrap.querySelector("#cropzoom").value = c.zoom; clamp(); }, { passive: false });
  wrap.querySelector("#cropzoom").addEventListener("input", (e) => { c.zoom = +e.target.value; clamp(); });
  const close = () => { wrap.remove(); URL.revokeObjectURL(img.src); };
  wrap.addEventListener("click", async (e) => {
    if (e.target.closest("[data-cropcancel]") || e.target === wrap) return close();
    if (!e.target.closest("[data-cropsave]")) return;
    const s = base * c.zoom, side = V / s, cx = W / 2 - c.x / s, cy = H / 2 - c.y / s;
    const cv = document.createElement("canvas"); cv.width = cv.height = 256;
    cv.getContext("2d").drawImage(img, cx - side / 2, cy - side / 2, side, side, 0, 0, 256, 256);
    const data = cv.toDataURL("image/jpeg", 0.82); close();
    st.busy = true; try { S = await api("photo", { photo: data }); } catch { notify(T.error); } st.busy = false; render();
  });
}
