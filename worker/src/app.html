<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Berlin Encore!</title>
<meta name="theme-color" content="#ffffff">
<meta name="description" content="Théâtre surtitré, expos et ciné en VO à Berlin, avec tes amis.">

<link rel="icon" type="image/png" href="/app/icon-180.png">

<meta name="mobile-web-app-capable" content="yes">

<style>
:root{
  /* Noir sur blanc, police moderne (Manrope). Accents rares : rouge (actions, « ! » du nom), or (étoiles). */
  --bg:#ffffff; --card:#f2f2f5; --ink:#111214; --muted:#686e75;
  --line:#e6e6ea;
  --velvet:#d7263d; --velvet-ink:#ffffff; --gold:#e0a100; --gold-soft:#fff6dc;
  --ok:#2f9e5b; --sans:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; --serif:var(--sans);
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
body{padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
button{font-family:inherit;color:inherit;cursor:pointer}

/* En-tête : le nom comme sur l'affiche, puis onglets et filtres collants. */
.mast{padding:14px 16px 8px;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:baseline;gap:8px;line-height:1}
.brand small{display:none}
.brand b{font:800 24px var(--sans);letter-spacing:-.03em}
.brand b i{font-style:normal;color:var(--velvet)}
.mast time{font:500 13px var(--sans);color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.top{position:sticky;top:0;z-index:3;background:var(--bg);padding:4px 12px 8px;border-bottom:1px solid var(--line)}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);border-block:2px solid var(--ink);margin:0 -12px}

.tab{border:0;border-right:2px solid var(--ink);background:var(--bg);padding:10px 4px;font:800 12.5px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink);border-radius:0}
.tab:last-child{border-right:0}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.filters{display:flex;gap:6px;overflow-x:auto;padding:8px 12px 0;margin:0 -12px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--ink);background:var(--bg);font:700 12px var(--sans);letter-spacing:.03em;text-transform:uppercase;padding:6px 8px;border-radius:0;white-space:nowrap}
/* Types : 4 cases égales sur toute la largeur, tout tient sur un téléphone. */
#kinds{gap:6px;overflow:visible}
#kinds .chip{flex:1 1 auto;text-align:center}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
/* Temporel : du texte, pas des boîtes ; le choix actif est souligné. */
#whens{gap:18px;padding-top:10px}
#whens .chip{border:0;background:none;padding:2px 0;font:600 14px var(--sans);letter-spacing:0;text-transform:none;color:var(--muted)}
#whens .chip[aria-pressed="true"]{background:none;color:var(--ink);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:5px;box-shadow:none}

/* Liste : un jour = un intertitre en italique, une ligne = heure | titre. */
.day{display:flex;align-items:baseline;gap:8px;padding:20px 16px 6px;font:800 17px var(--sans);letter-spacing:-.01em;color:var(--ink)}
.day span{font:500 14px var(--sans);color:var(--muted)}
.day em{font:600 11px var(--sans);font-style:normal;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.item{margin:0 10px;border-radius:0}
.item.open{background:var(--bg);border:2px solid var(--ink);box-shadow:5px 5px 0 var(--ink);margin:8px 14px 12px 10px}
.item.soldout:not(.open) .row{opacity:.42}.item.soldout .when small{color:var(--velvet);font-weight:800;text-transform:uppercase;letter-spacing:.04em}
em.sold{font-style:normal;font-weight:800;font-size:11px;color:var(--velvet);text-transform:uppercase;letter-spacing:.04em}.detail s{color:var(--muted)}
#whens .soldtoggle{margin-left:auto}
/* Quartiers : petites cases, plusieurs à la fois ; défile si besoin. */
#areas{gap:6px;padding-top:6px}
#areas .chip{border-width:1px;font-weight:600;font-size:11.5px;padding:5px 8px;color:var(--muted);border-color:var(--line)}
#areas .chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.row{display:grid;grid-template-columns:58px minmax(0,1fr) auto;gap:12px;align-items:start;padding:10px 8px;border:0;background:none;width:100%;text-align:left}
.when{font:700 15.5px var(--sans);font-variant-numeric:tabular-nums;text-align:right;padding-top:1px;line-height:1.1}
.when small{display:block;font:500 12px var(--sans);color:var(--muted);margin-top:3px}
.t{font:700 16px/1.3 var(--sans);letter-spacing:-.005em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.v{font-size:14px;color:var(--muted);margin-top:2px}
.v .sc{color:var(--ink);font-weight:700;white-space:nowrap}
.sc.link{text-decoration:underline;text-decoration-color:var(--gold);text-underline-offset:3px;cursor:pointer}
.venue{margin:14px 16px 2px;padding-top:10px;border-top:2px solid var(--ink);font:800 12.5px var(--sans);letter-spacing:.08em;text-transform:uppercase}
.badge.rescue{border:1.5px solid var(--ink);padding:3px 8px;font-weight:800;color:var(--ink);opacity:1}.dismissed .item:not(.open) .row .rescue{opacity:1}
.day.dim{color:var(--muted);border-top:1px solid var(--line);margin-top:18px}.day .fold{margin-left:auto;border:0;background:none;padding:0;font:600 13.5px var(--sans);color:var(--muted);text-decoration:underline;text-underline-offset:3px}.dismissed .item:not(.open) .row > :not(.rescue){opacity:.42}
.more{display:block;margin:0 0 4px 76px;border:0;background:none;padding:6px 0;font:700 13.5px var(--sans);color:var(--ink);text-decoration:underline;text-underline-offset:4px}
.v .k{color:var(--gold)}
.badge{font-size:15px;padding-top:2px}
.social{font-size:14px;color:var(--ink);margin-top:4px}

/* Critique : visible tout de suite, en citation. */
.review{margin-top:6px;display:flex;flex-direction:column;gap:2px}
.stars{color:var(--gold);letter-spacing:.06em;font-size:15px}
.stars i{font-style:normal;color:var(--line)}
.quote{font:italic 500 15px/1.45 var(--sans);color:var(--ink);overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.quote.full{-webkit-line-clamp:unset;display:block}
.noreview{font-size:14px;color:var(--velvet)}

.detail{padding:0 14px 14px 72px;display:grid;grid-template-columns:minmax(0,1fr);gap:8px;font-size:15px;overflow-wrap:anywhere}
@media (max-width:420px){.detail{padding-left:18px}}
.badge.rate{font:600 13px var(--sans);color:var(--gold);white-space:nowrap}
.who{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.who .lbl{font-size:12.5px;color:var(--muted);margin-right:2px}
.sent{font-size:13px;color:var(--ok)}
.note{width:100%;border:1.5px solid var(--ink);border-radius:0;padding:9px 10px;font:500 15px var(--sans);background:var(--bg);color:var(--ink)}
.review-in{resize:vertical;margin:8px 0 2px;line-height:1.4}
.note:focus{outline:2px solid var(--velvet);outline-offset:0}
.detail .m{color:var(--muted);font-size:14px}
.detail .syn{font:400 15px/1.5 var(--sans)}
.sect{font:600 11.5px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin-top:4px}
.mine{background:var(--gold-soft);border-left:3px solid var(--gold);border-radius:0;padding:10px 12px;display:grid;gap:4px}
.friend{display:grid;gap:1px;padding-left:10px;border-left:2px solid var(--line)}
.friend b{font:600 14px var(--sans)}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.act{border:1.5px solid var(--ink);background:var(--bg);font:700 13px var(--sans);letter-spacing:.02em;padding:8px 12px;border-radius:0;text-decoration:none;color:var(--ink)}
.act.on{background:var(--velvet);border-color:var(--velvet);color:var(--velvet-ink);box-shadow:3px 3px 0 var(--ink)}
.act.rate{padding:7px 9px;color:var(--gold);letter-spacing:.06em}
.act.rate.on{background:var(--gold);border-color:var(--gold);color:var(--card)}
.gone{opacity:.3;filter:grayscale(1);transition:opacity .35s}
.empty,.msg{padding:56px 28px;text-align:center;color:var(--muted);font:italic 500 16px var(--serif)}
.why{margin:22px 0 8px;padding:12px 14px;border-left:3px solid var(--ink);background:var(--card);font-size:13.5px;line-height:1.45;color:var(--muted)}.why p{margin:0 0 6px}.why p:last-child{margin:0}.why b{color:var(--ink)}
.set{padding:8px 18px}
.set .line{padding:12px 0;border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left;display:flex;justify-content:space-between;gap:12px;font:400 14.5px var(--sans)}
.set .line span{color:var(--muted)}
.set .line .dist{display:block;font-size:12.5px;color:var(--muted);margin-top:1px}
.set .line.on span{color:var(--ok)}
.fline{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.fline b{font-weight:700}.fline span{display:block;font-size:13px;color:var(--muted)}
.hint{color:var(--muted);font-size:13px;margin-top:14px}
.login{max-width:420px;margin:0 auto;padding:40px 24px;display:grid;gap:14px;text-align:left}
.login p{margin:0;color:var(--muted)}.login .act{text-align:center;padding:12px 14px;font-size:15px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;font:600 14px var(--sans);max-width:calc(100% - 32px);z-index:9}
.cat{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:18px;padding:10px 0 4px;border-top:2px solid var(--ink)}
.cat b{font:800 12.5px var(--sans);letter-spacing:.08em;text-transform:uppercase}.cat .act{padding:5px 10px;font-size:12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<header class="mast"><div class="brand"><small>BERLIN</small><b>Berlin Encore<i>!</i></b></div><time id="today"></time></header>
<div class="top">
  <div class="tabs" role="tablist">
    <button class="tab" data-tab="prog" aria-selected="true"></button>
    <button class="tab" data-tab="mine" aria-selected="false"></button>
    <button class="tab" data-tab="set" aria-selected="false"></button>
  </div>
  <div class="filters" id="kinds"></div>
  <div class="filters" id="areas"></div>
  <div class="filters" id="whens"></div>
</div>
<main id="list"><div class="msg">…</div></main>

//  - dans Telegram (mini-app) : Telegram signe initData, rien à faire ;
//  - ailleurs (navigateur, écran d'accueil, plus tard appli Capacitor) : connexion une fois via le bot,
//    puis un jeton de session gardé dans localStorage (Authorization: Bearer).
const INIT = (window.Telegram && Telegram.WebApp && Telegram.WebApp.initData) || "";
const tgApp = INIT ? Telegram.WebApp : null;
const WEB = !INIT;
// Appli native (Capacitor) : la page est embarquée, l'API reste sur le Worker.
const API_BASE = window.BE_API_BASE || "";
const TOKEN_KEY = "be_session";
let TOKEN = ""; try { TOKEN = localStorage.getItem(TOKEN_KEY) || ""; } catch {}
// Ouvert depuis une annonce du groupe (…/Programme?startapp=<fiche>) ou un lien web (/app?item=<fiche>) : cette fiche d'abord.
const FOCUS = (tgApp && tgApp.initDataUnsafe && tgApp.initDataUnsafe.start_param) || new URLSearchParams(location.search).get("item") || "";

if (tgApp) {
  tgApp.ready(); tgApp.expand();
  try { tgApp.setHeaderColor("#ffffff"); tgApp.setBackgroundColor("#ffffff"); } catch {}
}

const ICON = { theatre:"🎭", expo:"🏛", film:"🎬" };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const berlin = (d = new Date()) => new Intl.DateTimeFormat("en-CA", { timeZone:"Europe/Berlin", year:"numeric", month:"2-digit", day:"2-digit" }).format(d);
const TODAY = berlin(), TOMORROW = berlin(new Date(Date.now() + 864e5));
const plus = (n) => berlin(new Date(Date.now() + n * 864e5));
// « Ce mois » = le mois du calendrier (jusqu'au 30 novembre, pas 31 jours glissants).
const MONTH_END = (([y, m]) => m === 12 ? `${y + 1}-01-01` : `${y}-${String(m + 1).padStart(2, "0")}-01`)(TODAY.split("-").map(Number));
const LIMIT = { week: plus(7), month: MONTH_END, all: "9999" };

function next(x) {
  if (x.kind === "expo") return x.start && x.start > TODAY ? x.start : TODAY;
  // Réservé : la séance réservée, pas la prochaine date de la pièce.
  if (x.me && x.me.booked && x.me.booked.slice(0, 10) >= TODAY) return x.me.booked;
  const free = (x.dates || []).slice().sort().find((d) => d.slice(0, 10) >= TODAY) || null;
  if (st.hideSold) return free;
  const sold = (x.sold || []).slice().sort().find((d) => d.slice(0, 10) >= TODAY) || null;
  return free || sold;   // une séance libre passe avant une complète
}
/** Cette séance est complète (et ce n'est pas la mienne). */
const isSold = (x, d) => !!d && (x.sold || []).includes(d) && !(x.me && x.me.booked === d);
const dt = (d) => new Date(d.slice(0, 10) + "T12:00:00Z");
const cap = (w) => w.charAt(0).toUpperCase() + w.slice(1);
function dayLabel(d) {
  const k = d.slice(0, 10), t = dt(d);
  const full = `${T.dows[t.getUTCDay()]} ${t.getUTCDate()} ${T.mons[t.getUTCMonth()]}`;
  if (k === TODAY) return `${T.today} · ${full}`;
  if (k === TOMORROW) return `${T.tomorrow} · ${full}`;
  return cap(full);
}
const shortDay = (d) => `${+d.slice(8, 10)} ${T.smons[+d.slice(5, 7) - 1]}`;
const state = (x) => !x.me ? "" : x.me.status === "seen" ? "seen" : x.me.status === "ignored" ? "ignored" : x.me.booked ? "booked" : x.me.star ? "star" : "";
const badge = (x) => state(x) === "ignored" && st.dateCell ? `<span class="badge rescue" data-rescue="${x.id}" title="${esc(T.unignore)}">↩︎</span>` : state(x) === "seen" && x.me.rating ? `<span class="badge rate">${x.me.rating}★</span>` : `<span class="badge">${{ star:"⭐", booked:"🎟", seen:"✅" }[state(x)] || ""}</span>`;
const stars = (n) => n ? `<span class="stars">${"★".repeat(n)}<i>${"★".repeat(5 - n)}</i></span>` : "";

/** Lignes utiles de la fiche du bot (HTML Telegram) : lieu/salle, auteur, langue, critiques presse, résumé. */
function facts(x) {
  const txt = (x.text || "").replace(/<br\s*\/?>/g, "\n").replace(/<[^>]*>?/g, "");
  const d = document.createElement("textarea"); d.innerHTML = txt; const lines = d.value.split("\n").map((l) => l.trim());
  const pick = (p) => lines.filter((l) => l.startsWith(p));
  // Films : « (2026, Réalisateur) » sur la 1re ligne, « ★ 6,9 SC » / « ★ 3,8 LB » sur une ligne à part.
  const credits = x.kind === "film" ? ((lines[0] || "").match(/\(([^)]*\d{4}[^)]*)\)\s*$/) || [])[1] || "" : "";
  const rating = lines.find((l) => /^★\s*\d/.test(l)) || "";
  const ratingUrl = ((x.text || "").match(/<a href="(https?:[^"]+)"[^>]*>\s*★\s*\d[^<]*<\/a>/) || [])[1] || "";
  return { ratingUrl, meta: [...(credits ? ["🎬 " + credits] : []), ...pick("📍"), ...pick("✍️"), ...pick("🗣"), ...pick("📰")],
           rating, syn: pick("📝").map((l) => l.replace(/^📝\s*/, "")).join(" ").slice(0, 420) };
}

async function api(path, extra = {}) {
  const headers = { "content-type":"application/json" };
  if (WEB && TOKEN) headers.authorization = "Bearer " + TOKEN;
  const r = await fetch(API_BASE + "/app/api/" + path, { method:"POST", headers, body: JSON.stringify({ ...(INIT ? { initData: INIT } : {}), focus: FOCUS, ...extra }) });
  const j = await r.json().catch(() => ({}));
  if (WEB && r.status === 401 && !path.startsWith("login/") && path !== "logout") { setToken(""); showLogin(); }
  if (!r.ok) throw Object.assign(new Error(j.error || r.status), { info: j, status: r.status });
  return j;
}
function setToken(t) { TOKEN = t; try { t ? localStorage.setItem(TOKEN_KEY, t) : localStorage.removeItem(TOKEN_KEY); } catch {} }
/** Message bref : la bulle Telegram dans la mini-app, un bandeau ailleurs. */
function notify(text, then) {
  if (tgApp?.showAlert) return tgApp.showAlert(text, then);
  document.querySelector(".toast")?.remove();
  const d = document.createElement("div"); d.className = "toast"; d.setAttribute("role", "status"); d.textContent = text;
  document.body.appendChild(d); setTimeout(() => d.remove(), 3200); then?.();
}

// --- Connexion hors Telegram -------------------------------------------------
// Par email (code à 6 chiffres ou lien) ; tant que l'envoi d'emails n'est pas activé côté
// serveur, repli sur le bot Telegram (lien t.me/<bot>?start=web_<nonce> + « ✅ Oui »).
let loginTimer = null, loginNonce = null, loginT0 = 0, loginCfg = null;
const login = { step: "email", email: "", id: null, err: "" };
async function showLogin(state = {}) {
  S = null; clearTimeout(loginTimer); if (!state.link) loginNonce = null;
  document.querySelector(".top").hidden = true;
  if (!loginCfg) { try { loginCfg = await api("login/config"); } catch { loginCfg = { email: false }; } }
  const ios = /iphone|ipad/i.test(navigator.userAgent) && !navigator.standalone ? `<p class="hint">${esc(T.installHint)}</p>` : "";
  let body;
  if (loginCfg.email) {
    body = login.step === "code"
      ? `<p>${esc(T.codeSent(login.email))}</p>
         <input id="lcode" class="note" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="${esc(T.codePh)}">
         <button class="act on" data-logincode="1">${esc(T.signIn)}</button>
         <button class="act" data-loginback="1">${esc(T.otherEmail)}</button>`
      : `<p>${esc(T.loginEmailHint)}</p>
         <input id="lemail" class="note" type="email" inputmode="email" autocomplete="email" placeholder="${esc(T.emailPh)}" value="${esc(login.email)}">
         <button class="act on" data-loginemail="1">${esc(T.sendCode)}</button>`;
    body += login.err ? `<p class="noreview">${esc(login.err)}</p>` : "";
  } else {
    body = `<p>${esc(T.loginHint)}</p>` + (state.expired
      ? `<p>${esc(T.loginExpired)}</p><button class="act on" data-login="1">${esc(T.retry)}</button>`
      : state.link
        ? `<a class="act on" href="${esc(state.link)}" target="_blank" rel="noopener">${esc(T.loginBtn)}</a><p>${esc(T.loginWait)}</p>`
        : `<div class="msg">…</div>`);
  }
  $("list").innerHTML = `<div class="login">${body}${ios}</div>`;
  setTimeout(() => ($("lcode") || $("lemail"))?.focus(), 0);
  if (!loginCfg.email && !state.link && !state.expired) startLogin();
}
const LOGIN_ERR = { bad_email: "badEmail", unknown_email: "unknownEmail", too_many: "tooMany", expired: "codeExpired" };
async function loginEmail() {
  login.email = ($("lemail")?.value || "").trim(); login.err = "";
  try { const j = await api("login/email", { email: login.email }); login.id = j.id; login.step = "code"; }
  catch (e) { login.err = T[LOGIN_ERR[e.info?.error]] || T.error; }
  showLogin();
}
async function loginCode() {
  const code = ($("lcode")?.value || "").replace(/\D/g, ""); login.err = "";
  try { const j = await api("login/code", { id: login.id, code }); return void signedIn(j.token); }
  catch (e) {
    if (e.info?.error === "bad_code") login.err = T.badCode(e.info.left);
    else { login.err = T[LOGIN_ERR[e.info?.error]] || T.error; if (e.status === 410) login.step = "email"; }
  }
  showLogin();
}
function signedIn(token) { setToken(token); login.step = "email"; login.err = ""; document.querySelector(".top").hidden = false; load(); }
document.addEventListener("keydown", (e) => {
  if (e.key !== "Enter") return;
  if (e.target.id === "lemail") loginEmail(); else if (e.target.id === "lcode") loginCode();
});
document.addEventListener("input", (e) => { if (e.target.id === "lcode" && e.target.value.replace(/\D/g, "").length === 6) loginCode(); });
// Lien de l'email : /app?login=<lien> → connecté·e, puis l'adresse redevient /app.
const LOGIN_LINK = new URLSearchParams(location.search).get("login");
if (LOGIN_LINK) history.replaceState(null, "", location.pathname);

async function startLogin() {
  try { const j = await api("login/start"); showLogin({ link: j.link }); loginNonce = j.nonce; loginT0 = Date.now(); pollLogin(); }
  catch { $("list").innerHTML = `<div class="msg">${esc(T.error)}</div>`; }
}
async function pollLogin() {
  clearTimeout(loginTimer); loginTimer = null;
  const nonce = loginNonce; if (!nonce) return;
  try {
    const j = await api("login/poll", { nonce });
    if (nonce !== loginNonce) return;
    if (j.token) { loginNonce = null; return void signedIn(j.token); }
  } catch (e) { if (e.status === 410) { loginNonce = null; return void showLogin({ expired: true }); } }
  if (Date.now() - loginT0 > 10 * 60e3) { loginNonce = null; return void showLogin({ expired: true }); }
  loginTimer = setTimeout(pollLogin, document.hidden ? 5000 : 1500);
}
// Retour depuis Telegram : on vérifie tout de suite.
document.addEventListener("visibilitychange", () => { if (!document.hidden && loginNonce) pollLogin(); });

async function load() {
  if (WEB && LOGIN_LINK && !TOKEN) {
    try { setToken((await api("login/link", { link: LOGIN_LINK })).token); }
    catch { login.err = T.codeExpired; }
  }
  if (WEB && !TOKEN) return void showLogin();
  try { S = await api("state"); T = L[S.lang] || L.fr; document.documentElement.lang = S.lang; render(); }
  catch (e) {
    if (e.status === 401 && WEB) return;
    $("list").innerHTML = e.info?.error === "not_member"
      ? `<div class="msg">${esc(T.notMember)}<a href="https://t.me/${esc(e.info.bot)}">@${esc(e.info.bot)}</a></div>`
      : `<div class="msg">${esc(T.error)}</div>`;
  }
}
async function act(op, id, arg, extra = {}) {
  if (st.busy) return; st.busy = true;
  // « Pas pour moi » : la fiche se grise, puis sort du programme (retrouvable via /ignores dans le chat).
  if (op === "x") {
    document.querySelector(`.item[data-item="${id}"]`)?.classList.add("gone");
    await new Promise((r) => setTimeout(r, 400));
    st.open = null;
  }
  try { tgApp?.HapticFeedback?.selectionChanged(); S = await api(extra.path || "act", { op, id, arg, ...extra.body }); if (S.sent) st.sent = { id, names: S.sent }; T = L[S.lang] || L.fr; document.documentElement.lang = S.lang; }
  catch { notify(T.error); }
  st.busy = false; st.picking = null; st.sharing = null; st.sel.clear(); st.withs.clear(); render();
  // ✍️ : la critique s'écrit dans le chat, en réponse à l'invitation que le bot vient d'envoyer.
  if (op === "w" && tgApp) tgApp.showAlert(T.reviewInChat, () => tgApp.close());
}

function chips(el, items, key) {
  el.innerHTML = items.map(([v, l]) => `<button class="chip" data-${key}="${v}" aria-pressed="${st[key] === v}">${l}</button>`).join("");
}
function socialLine(x) {
  const f = x.friends || []; const parts = [];
  const mine = x.me && x.me.booked;
  const together = mine ? f.filter((p) => p.booked === mine).map((p) => esc(p.name)) : [];
  if (together.length) parts.push(`🎟 ${esc(T.withF)} ${together.join(", ")}`);
  const want = f.filter((p) => (p.star || p.booked) && !p.seen && !(mine && p.booked === mine)).map((p) => esc(p.name) + (p.booked ? " 🎟" : ""));
  if (want.length) parts.push("⭐ " + want.join(", "));
  const seen = f.filter((p) => p.seen).map((p) => esc(p.name) + (p.rating ? ` <span class="stars">${"★".repeat(p.rating)}</span>` : ""));
  if (seen.length) parts.push("✅ " + seen.join(", "));
  return parts.length ? `<div class="social">${parts.join(" · ")}</div>` : "";
}
function reviewBlock(x, full) {
  const me = x.me || {};
  if (state(x) !== "seen") return "";
  if (!me.rating && !me.comment) return `<div class="review"><span class="noreview">${esc(T.noReview)}</span></div>`;
  return `<div class="review">${stars(me.rating)}${me.comment ? `<div class="quote${full ? " full" : ""}">« ${esc(me.comment)} »</div>` : `<span class="noreview">${esc(T.noReview)}</span>`}</div>`;
}
function whenCell(x) {
  if (x.kind === "expo") return ICON.expo;
  const n = next(x);
  if (st.tab === "prog" && st.dateCell && n) return `${+n.slice(8, 10)} ${esc(T.smons[+n.slice(5, 7) - 1])}<small>${n.slice(11)}</small>`;
  if (st.tab === "prog") return `${n ? n.slice(11) : "—"}<small>${isSold(x, n) ? esc(T.soldShort) : ICON[x.kind]}</small>`;
  const d = (x.me && x.me.booked) || n || (x.dates || []).slice().sort().pop();
  if (!d) return ICON[x.kind];
  return `${+d.slice(8, 10)} ${esc(T.smons[+d.slice(5, 7) - 1])}<small>${esc(T.dows[dt(d).getUTCDay()].slice(0, 3))}${d.length > 10 ? " " + d.slice(11, 16) : ""}</small>`;
}
/** « ★ 6,9 SC » : un clic ouvre la fiche SensCritique / Letterboxd. */
const scTag = (f) => f.ratingUrl ? `<b class="sc link" data-href="${esc(f.ratingUrl)}">${esc(f.rating)} ↗</b>` : `<b class="sc">${esc(f.rating)}</b>`;
function item(x) {
  const open = st.open === x.id, s = state(x), me = x.me || {};
  const soldNow = st.tab === "prog" && isSold(x, next(x));
  let h = `<div class="item${open ? " open" : ""}${soldNow ? " soldout" : ""}" data-item="${x.id}"><button class="row" data-open="${x.id}" aria-expanded="${open}">
    <div class="when">${whenCell(x)}</div>
    <div><div class="t">${esc(x.title)}</div><div class="v">${[st.grouped ? "" : esc(x.venue), x.kind === "expo" && x.end ? `${esc(T.until)} ${esc(shortDay(x.end))}` : ""].filter(Boolean).join(" · ")}${facts(x).rating ? ` · ${scTag(facts(x))}` : ""}</div>${s === "seen" ? reviewBlock(x, false) : socialLine(x)}</div>
    ${badge(x)}</button>`;
  if (!open) return h + "</div>";
  const upcoming = (x.dates || []).filter((d) => d.slice(0, 10) >= TODAY).sort();
  const dates = x.kind === "expo"
    ? [x.start && x.start > TODAY ? `${T.from} ${shortDay(x.start)}` : "", x.end ? `${T.until} ${shortDay(x.end)}` : ""].filter(Boolean).join(", ")
    : [...upcoming, ...(x.sold || []).filter((d) => d.slice(0, 10) >= TODAY)].sort().slice(0, 10)
        .map((d) => isSold(x, d) ? `<s>${esc(dayLabel(d))} ${d.slice(11)}</s> <em class="sold">${esc(T.soldShort)}</em>` : esc(`${dayLabel(d)} ${d.slice(11)}`)).join(" · ");
  const f = facts(x);
  h += `<div class="detail">`;
  if (s === "seen") {
    h += `<div class="mine"><div class="sect">${esc(T.myReview)}</div>${me.rating || me.comment ? reviewBlock(x, true) : ""}
      <div class="acts">${[1,2,3,4,5].map((n) => `<button class="act rate ${me.rating === n ? "on" : ""}" data-act="r" data-id="${x.id}" data-arg="${n}">${n}★</button>`).join("")}</div>
      ${st.writing === x.id ? `<textarea id="review" class="note review-in" maxlength="500" rows="4" placeholder="${esc(T.reviewPh)}">${esc(me.comment || "")}</textarea>
      <div class="acts"><button class="act on" data-savereview="${x.id}">${esc(T.save)}</button><button class="act" data-writing="">${esc(T.cancel)}</button></div>` : ""}
      <div class="acts">${st.writing === x.id ? "" : `<button class="act" data-writing="${x.id}">${me.comment ? T.editReview : T.writeReview}</button>`}
      <button class="act" data-act="u" data-id="${x.id}">${T.undoSeen}</button></div></div>`;
  }
  const friends = (x.friends || []).filter((p) => p.seen && (p.rating || p.comment));
  if (friends.length) h += `<div class="sect">${esc(T.band)}</div>` + friends.map((p) =>
    `<div class="friend"><b>${esc(p.name)} ${stars(p.rating)}</b>${p.comment ? `<div class="quote">« ${esc(p.comment)} »</div>` : ""}</div>`).join("");
  if (s !== "seen" && dates) h += `<div>🗓 ${x.kind === "expo" ? esc(dates) : dates}</div>`;
  if (me.booked && s !== "seen") h += `<div>🎟 ${esc(dayLabel(me.booked))} ${esc(me.booked.slice(11))}</div>`;
  if (f.rating) h += `<div>${scTag(f)}</div>`;
  h += f.meta.map((l) => `<div class="m">${esc(l)}</div>`).join("");
  if (f.syn) h += `<div class="syn">${esc(f.syn)}${f.syn.length >= 420 ? "…" : ""}</div>`;
  const people = S.people || [];
  if (st.sent && st.sent.id === x.id && st.sent.names.length) h += `<div class="sent">✓ ${esc(T.sentTo)} ${esc(st.sent.names.join(", "))}</div>`;
  if (st.sharing === x.id) {
    h += `<div class="sect">${esc(T.send.replace("…", ""))}</div><div class="who">${people.map((p) =>
      `<button class="act ${st.sel.has(p.id) ? "on" : ""}" data-sel="${p.id}">${esc(p.name)}</button>`).join("")}
      </div>
      <input id="note" class="note" maxlength="200" placeholder="${esc(T.notePh)}" value="${esc(st.note)}">
      <div class="who">${noteIdeas(x).map((n) => `<button class="chip" data-note="${esc(n)}">${esc(n)}</button>`).join("")}</div>
      <div class="acts"><button class="act on" data-share="${x.id}" ${st.sel.size ? "" : "disabled"}>${esc(T.sendGo)} ↗</button></div>`;
  } else if (st.picking === x.id) {
    if (people.length) h += `<div class="who"><span class="lbl">${esc(T.forWho)}</span><button class="act on" disabled>${esc(T.me)}</button>${people.map((p) =>
      `<button class="act ${st.withs.has(p.id) ? "on" : ""}" data-with="${p.id}">+ ${esc(p.name)}</button>`).join("")}</div>`;
    h += `<div class="sect">${esc(T.pick)}</div><div class="acts">${upcoming.slice(0, 12).map((d) =>
      `<button class="act" data-act="bd" data-id="${x.id}" data-arg="${d.replace(/\D/g, "").slice(0, 12)}">${esc(dayLabel(d))} ${d.slice(11)}</button>`).join("")}
      ${me.booked ? `<button class="act" data-act="bx" data-id="${x.id}">${esc(T.cancelBook)}</button>` : ""}</div>`;
  } else if (s !== "seen") {
    h += `<div class="acts">
      <button class="act ${me.star ? "on" : ""}" data-act="i" data-id="${x.id}">${T.star}</button>
      ${x.kind !== "expo" && upcoming.length ? `<button class="act ${me.booked ? "on" : ""}" data-pick="${x.id}">${T.book}</button>` : ""}
      <button class="act" data-act="v" data-id="${x.id}">${T.seen}</button>
      ${s === "ignored" ? `<button class="act on" data-act="u" data-id="${x.id}">${T.unignore}</button>` : `<button class="act" data-act="x" data-id="${x.id}">${T.ignore}</button>`}
      ${(S.people || []).length ? `<button class="act" data-sharing="${x.id}">${T.send}</button>` : ""}
      ${x.url ? `<a class="act" href="${esc(x.url)}" data-link="1" target="_blank" rel="noopener">${T.site}</a>` : ""}</div>`;
  } else if (x.url) {
    h += `<div class="acts"><a class="act" href="${esc(x.url)}" data-link="1" target="_blank" rel="noopener">${T.site}</a></div>`;
  }
  return h + "</div></div>";
}
// Expos : groupées par lieu (ordre des Réglages), 2 par lieu, d'abord celles qui intéressent
// quelqu'un (⭐ 🎟), puis celles dont la presse parle (ligne 📰 avec des sources), puis la fin la plus proche.
/** Idées de petit mot : les prochains jours où ça se joue (« Mardi 10 ? »), sinon « Ce week-end ? ». */
function noteIdeas(x) {
  const days = [...new Set((x.dates || []).filter((d) => d.slice(0, 10) >= TODAY).sort().map((d) => d.slice(0, 10)))].slice(0, 3);
  const out = days.map((d) => d === TODAY ? T.tonight : `${cap(T.dows[dt(d).getUTCDay()])} ${+d.slice(8, 10)}${S.lang === "en" ? "?" : " ?"}`);
  return out.length ? out : [T.weekend];
}
/** Réglages → Compte : email de connexion (lié depuis Telegram ou le web), déconnexion. */
function accountSection() {
  const e = S.email;
  let h = `<p class="hint">${esc(T.emailHint)}</p>`;
  if (st.editEmail) {
    h += `<input id="setemail" class="note" type="email" inputmode="email" autocomplete="email" placeholder="${esc(T.emailPh)}" value="${esc(e || "")}">
      <div class="acts"><button class="act on" data-saveemail="1">${esc(T.save)}</button><button class="act" data-editemail="">${esc(T.cancel)}</button>
      ${e ? `<button class="act" data-saveemail="clear">${esc(T.removeEmail)}</button>` : ""}</div>`;
  } else {
    h += `<div class="fline"><div><b>${esc(T.emailT)}</b><span>${esc(e || T.emailNone)}</span></div>
      <button class="act${e ? "" : " on"}" data-editemail="1">${esc(e ? T.editEmail : T.addEmail)}</button></div>`;
  }
  if (WEB) h += `<div class="acts" style="margin-top:12px"><button class="act" data-logout="1">${esc(T.logout)}</button></div>`;
  return h;
}
/** Réglages → Mes amis : demandes reçues, amis, suggestions (amis de mes amis), lien d'invitation. */
function friendsSection() {
  const c = S.circle || { friends: [], incoming: [], outgoing: [], suggestions: [] };
  const line = (name, sub, btns) => `<div class="fline"><div><b>${esc(name)}</b>${sub ? `<span>${esc(sub)}</span>` : ""}</div><div class="who">${btns}</div></div>`;
  const btn = (op, id, label, on = false) => `<button class="act ${on ? "on" : ""}" data-friend="${op}" data-id="${id}">${esc(label)}</button>`;
  let h = "";
  if (c.incoming.length) h += dayHead(T.requestsT) + c.incoming.map((p) => line(p.name, "", btn("accept", p.id, T.accept, true) + btn("ignore", p.id, T.ignoreR))).join("");
  h += dayHead(T.friendsT) + (c.friends.length ? c.friends.map((p) => line(p.name, "",
      st.confirmRemove === p.id ? btn("remove", p.id, T.sure, true) : `<button class="act" data-askremove="${p.id}">${esc(T.removeF)}</button>`)).join("")
    : `<p class="hint">${esc(T.noFriends)}</p>`);
  const sugg = [...c.outgoing.map((p) => line(p.name, T.pendingR, btn("remove", p.id, T.cancelR))),
                ...c.suggestions.map((p) => line(p.name, `${T.via} ${p.via.join(", ")}`, btn("add", p.id, T.add, true)))];
  if (sugg.length) h += dayHead(T.suggestT) + sugg.join("");
  h += dayHead(T.inviteT) + `<p class="hint">${esc(T.inviteHint)}</p><div class="acts"><button class="act on" data-invite="1">${esc(T.shareLink)} ↗</button></div>`;
  return h;
}
function exposByVenue(expos) {
  const order = new Map((S.venues || []).map((v, i) => [v.name, i]));
  const groups = new Map();
  for (const x of expos) (groups.get(x.venue) || groups.set(x.venue, []).get(x.venue)).push(x);
  const score = (x) => ((x.me && (x.me.star || x.me.booked)) || (x.friends || []).some((p) => p.star || p.booked) ? 2 : 0)
    + (/📰[^\n]*\d+\s*(source|critique|review)/i.test(x.text || "") ? 1 : 0) + (x.starred ? 1 : 0);
  let h = "";
  for (const [venue, xs] of [...groups].sort((a, b) => (order.get(a[0]) ?? 99) - (order.get(b[0]) ?? 99))) {
    xs.sort((a, b) => score(b) - score(a) || (a.end || "9").localeCompare(b.end || "9"));
    const open = st.venuesOpen.has(venue) || xs.some((x) => x.id === st.open && xs.indexOf(x) >= 2);
    const shown = open ? xs : xs.slice(0, 2);
    st.grouped = true; h += `<div class="venue">${esc(venue)}</div>` + shown.map(item).join(""); st.grouped = false;
    if (xs.length > 2) h += `<button class="more" data-venue="${esc(venue)}">${esc(open ? T.lessExpos : T.moreExpos(xs.length - 2, venue))}</button>`;
  }
  return h;
}
const dayHead = (label, note = "") => { const [a, b] = String(label).split(" · "); return `<div class="day">${esc(a)}${b ? ` <span>${esc(b)}</span>` : ""}${note ? ` <span>${esc(note)}</span>` : ""}</div>`; };
/** Sous le programme : ce qui n'y est pas et pourquoi (écarté, vu, réservé plus tard), la règle
 *  (surtitres EN, pas complet) et les prochaines ouvertures de billetterie. */
/** Filtre quartiers : aucun choisi = partout. */
function inArea(x) {
  if (!st.areas.size) return true;
  const v = (S.venues || []).find((v) => v.id === x.venue_id);
  return !!v && st.areas.has(v.district);
}
function whyNote() {
  if (st.kind === "expo") return "";
  const shows = S.items.filter((x) => x.kind !== "expo" && (st.kind === "all" || x.kind === st.kind) && inArea(x));
  const inWin = (x) => (x.dates || []).some((d) => d.slice(0, 10) >= TODAY && d.slice(0, 10) < LIMIT[st.when]);
  const n = (k) => shows.filter((x) => inWin(x) && state(x) === k).length;
  const soldHidden = st.hideSold ? shows.filter((x) => !["seen", "ignored"].includes(state(x)) && !(x.dates || []).some((d) => d.slice(0, 10) >= TODAY && d.slice(0, 10) < LIMIT[st.when])
    && (x.sold || []).some((d) => d.slice(0, 10) >= TODAY && d.slice(0, 10) < LIMIT[st.when])).length : 0;
  const later = shows.filter((x) => ["booked", "star"].includes(state(x)) && next(x) && next(x).slice(0, 10) >= LIMIT[st.when]).length;
  const bits = [[st.hideDismissed ? n("ignored") : 0, T.whyIgnored], [n("seen"), T.whySeen], [later, T.whyLater], [soldHidden, T.whySold]].filter(([c]) => c).map(([c, f]) => f(c));
  const lines = [];
  if (bits.length) lines.push(T.whyHidden + " " + bits.join(", ") + ".");
  if (st.kind !== "film") lines.push(T.whyRule);
  const sales = (S.sales || []).map((x) => `<b>${esc(x.venue)}</b> ${esc(shortDay(x.day))}${x.at ? " " + x.at : ""} (${esc(T.monthName(x.month))})`);
  if (st.kind !== "film" && sales.length) lines.push(`🎟 ${esc(T.whySales)} ${sales.join(" · ")}`);
  return lines.length ? `<div class="why">${lines.map((l) => `<p>${l}</p>`).join("")}</div>` : "";
}
function render() {
  const now = dt(TODAY);
  $("today").textContent = `${T.dows[now.getUTCDay()].slice(0, 3)}. ${now.getUTCDate()} ${T.smons[now.getUTCMonth()]}`;
  document.querySelectorAll(".tab").forEach((b, i) => { b.textContent = T.tabs[i]; b.setAttribute("aria-selected", b.dataset.tab === st.tab); });
  const K = $("kinds"), W = $("whens"), list = $("list");
  if (!S) return;
  const A = $("areas");
  K.hidden = st.tab === "set"; W.hidden = st.tab !== "prog"; A.hidden = st.tab === "set";
  if (st.tab === "set") {
    // Lieux par type : un bouton suit / ne suit plus tous les théâtres (expos, cinémas) d'un coup.
    const cats = ["theatre", "expo", "cinema"].map((k) => [k, S.venues.filter((v) => v.kind === k)]).filter(([, vs]) => vs.length);
    list.innerHTML = `<div class="set">${friendsSection()}${dayHead(T.venues)}<p class="hint">${esc(T.tapToggle)}</p>${cats.map(([k, vs]) => {
      const any = vs.some((v) => v.followed);
      return `<div class="cat"><b>${ICON[k === "cinema" ? "film" : k]} ${esc(T.cats[k])} · ${vs.filter((v) => v.followed).length}/${vs.length}</b>
        <button class="act${any ? "" : " on"}" data-act="sk" data-id="${k}" data-arg="${any ? "off" : "on"}">${esc(any ? T.catOff : T.catOn)}</button></div>` +
        vs.map((v) => `<button class="line${v.followed ? " on" : ""}" data-act="s" data-id="${esc(v.id)}"><div>${esc(v.name)}${v.district ? `<small class="dist">${esc(v.district)}</small>` : ""}</div><span>${v.followed ? "✓ " + esc(T.followed) : esc(T.unfollowed)}</span></button>`).join("");
    }).join("")}
      ${dayHead(T.language)}<div class="acts">${[["fr", "🇫🇷 Français"], ["en", "🇬🇧 English"]].map(([c, l]) =>
        `<button class="act ${S.lang === c ? "on" : ""}" data-act="l" data-id="${c}">${l}</button>`).join("")}</div>
      ${dayHead(T.account)}${accountSection()}</div>`;
    return;
  }
  // Types suivis seulement : ne plus suivre aucun cinéma retire « Ciné » du menu.
  const followedKinds = new Set(S.venues.filter((v) => v.followed).map((v) => v.kind === "cinema" ? "film" : v.kind));
  const kindChips = [["theatre", T.theatre], ["film", T.film], ["expo", T.expo]].filter(([k]) => followedKinds.has(k));
  if (st.kind !== "all" && !followedKinds.has(st.kind)) st.kind = "all";
  K.hidden = kindChips.length < 2;
  chips(K, kindChips.length < 2 ? [] : [["all", T.all], ...kindChips], "kind");
  // Quartiers des lieux suivis (dans le type choisi) ; plusieurs à la fois, mémorisés.
  const vKind = (v) => v.kind === "cinema" ? "film" : v.kind;
  const areas = [...new Set(S.venues.filter((v) => v.followed && v.district && (st.kind === "all" || vKind(v) === st.kind)).map((v) => v.district))].sort();
  for (const a of [...st.areas]) if (!areas.includes(a)) st.areas.delete(a);
  A.hidden = A.hidden || areas.length < 2;
  A.innerHTML = areas.length < 2 ? "" : `<button class="chip" data-area="" aria-pressed="${!st.areas.size}">${esc(T.everywhere)}</button>` +
    areas.map((a) => `<button class="chip" data-area="${esc(a)}" aria-pressed="${st.areas.has(a)}">${esc(a)}</button>`).join("");

  chips(W, [["week", T.week], ["month", T.month], ["all", T.any]], "when");
  if (st.kind !== "expo") W.insertAdjacentHTML("beforeend", `<button class="chip soldtoggle" data-hidesold="1" aria-pressed="${!!st.hideSold}">${esc(T.hideSold)}</button>`);
  let xs = S.items.filter((x) => (st.kind === "all" || x.kind === st.kind) && inArea(x));
  let h = "";
  if (st.tab === "prog") {
    // Ce que j'ai vu ou écarté n'est plus reproposé (sauf la fiche ouverte, le temps de voir l'effet du clic).
    // 🙅 de la période : repliés tout en bas, grisés, avec « ↩︎ Finalement si ».
    const dismissed = xs.filter((x) => state(x) === "ignored" && next(x) && next(x).slice(0, 10) < LIMIT[st.when])
      .sort((a, b) => next(a).localeCompare(next(b)));
    xs = xs.filter((x) => (!["seen", "ignored"].includes(state(x)) || (x.id === st.open && state(x) === "seen")) && next(x) && next(x).slice(0, 10) < LIMIT[st.when]);
    const focused = st.focus && xs.find((x) => x.id === st.focus) || (st.focus && st.kind === "all" && S.items.find((x) => x.id === st.focus));
    if (focused) { h += dayHead(T.shared) + item(focused); xs = xs.filter((x) => x.id !== st.focus); }
    const shows = xs.filter((x) => x.kind !== "expo").sort((a, b) => next(a).localeCompare(next(b)));
    const expos = xs.filter((x) => x.kind === "expo").sort((a, b) => (a.end || "9").localeCompare(b.end || "9"));
    let cur = "";
    for (const x of shows) { const d = dayLabel(next(x)); if (d !== cur) { h += dayHead(d); cur = d; } h += item(x); }
    if (expos.length) h += dayHead(T.expos, T.exposNote) + exposByVenue(expos);
    if (dismissed.length) {
      // Affichés par défaut, grisés, à la fin ; « Masquer » les replie (mémorisé).
      h += `<div class="day dim">${esc(T.notForMeN(dismissed.length))}<button class="fold" data-dismissed="1">${esc(st.hideDismissed ? T.showD : T.hideD)}</button></div>`;
      if (!st.hideDismissed) { st.dateCell = true; h += `<div class="dismissed">${dismissed.map(item).join("")}</div>`; st.dateCell = false; }
    }
    list.innerHTML = (h || `<div class="empty">${esc(T.empty)}</div>`) + whyNote();
  } else {
    for (const [k, l] of [["booked", T.booked], ["star", T.wish], ["seen", T.done]]) {
      let g = xs.filter((x) => state(x) === k);
      g = k === "seen" ? g.sort((a, b) => (b.me.at || "").localeCompare(a.me.at || "")).slice(0, 40)
        : g.sort((a, b) => (k === "booked" ? a.me.booked : next(a) || "9").localeCompare(k === "booked" ? b.me.booked : next(b) || "9"));
      if (g.length) h += dayHead(`${l} · ${g.length}`) + g.map(item).join("");
    }
    list.innerHTML = h || `<div class="empty">${esc(T.emptyMine)}</div>`;
  }
}
document.addEventListener("click", (e) => {
  const a = e.target.closest("a[data-link]");
  if (a) { if (tgApp?.openLink) { e.preventDefault(); tgApp.openLink(a.href); } return; }
  const rs = e.target.closest("[data-rescue]");
  if (rs) { e.preventDefault(); e.stopPropagation(); return void act("u", rs.dataset.rescue); }
  const sc = e.target.closest("[data-href]");
  if (sc) { e.preventDefault(); e.stopPropagation(); tgApp?.openLink ? tgApp.openLink(sc.dataset.href) : window.open(sc.dataset.href, "_blank"); return; }
  const t = e.target.closest("button"); if (!t) return;
  if (t.dataset.tab || t.dataset.kind || t.dataset.when || t.dataset.hidesold || t.dataset.area !== undefined) st.focus = null;
  if (t.dataset.tab) { st.tab = t.dataset.tab; st.open = null; window.scrollTo?.(0, 0); }
  else if (t.dataset.kind) st.kind = t.dataset.kind;
  else if (t.dataset.area !== undefined) {
    const a = t.dataset.area; if (!a) st.areas.clear(); else st.areas.has(a) ? st.areas.delete(a) : st.areas.add(a);
    try { localStorage.setItem("areas", JSON.stringify([...st.areas])); } catch {}
  }
  else if (t.dataset.hidesold) { st.hideSold = !st.hideSold; try { localStorage.setItem("hideSold", st.hideSold ? "1" : ""); } catch {} }
  else if (t.dataset.when) st.when = t.dataset.when;
  else if (t.dataset.pick) { st.picking = st.picking === t.dataset.pick ? null : t.dataset.pick; st.sharing = null; st.withs.clear(); }
  else if (t.dataset.sharing) { st.sharing = st.sharing === t.dataset.sharing ? null : t.dataset.sharing; st.picking = null; st.sel.clear(); }
  else if (t.dataset.sel) { const n = +t.dataset.sel; st.sel.has(n) ? st.sel.delete(n) : st.sel.add(n); }
  else if (t.dataset.with) { const n = +t.dataset.with; st.withs.has(n) ? st.withs.delete(n) : st.withs.add(n); }
  else if (t.dataset.writing !== undefined) { st.writing = t.dataset.writing || null; render(); if (st.writing) setTimeout(() => $("review")?.focus(), 0); return; }
  else if (t.dataset.savereview) { const txt = $("review")?.value || ""; st.writing = null; return void act("review", t.dataset.savereview, "", { path: "review", body: { text: txt } }); }
  else if (t.dataset.note) { st.note = t.dataset.note; }
  else if (t.dataset.share) { const n = st.note; st.note = ""; return void act("share", t.dataset.share, "", { path: "share", body: { to: [...st.sel], note: n } }); }
  else if (t.dataset.act === "bd") return void act("bd", t.dataset.id, t.dataset.arg, { body: { with: [...st.withs] } });
  else if (t.dataset.act) return void act(t.dataset.act, t.dataset.id, t.dataset.arg);
  else if (t.dataset.askremove) { st.confirmRemove = +t.dataset.askremove; }
  else if (t.dataset.friend) { st.confirmRemove = null; return void friendAct(t.dataset.friend, +t.dataset.id); }
  else if (t.dataset.invite) { return void shareInvite(); }
  else if (t.dataset.login) { return void showLogin(); }
  else if (t.dataset.loginemail) { return void loginEmail(); }
  else if (t.dataset.logincode) { return void loginCode(); }
  else if (t.dataset.loginback) { login.step = "email"; login.err = ""; return void showLogin(); }
  else if (t.dataset.editemail !== undefined) { st.editEmail = !!t.dataset.editemail; render(); if (st.editEmail) setTimeout(() => $("setemail")?.focus(), 0); return; }
  else if (t.dataset.saveemail) { return void saveEmail(t.dataset.saveemail === "clear" ? "" : ($("setemail")?.value || "")); }
  else if (t.dataset.logout) { api("logout").catch(() => {}).finally(() => { setToken(""); st.tab = "prog"; showLogin(); }); return; }
  else if (t.dataset.dismissed) { st.hideDismissed = !st.hideDismissed; try { localStorage.setItem("hideDismissed", st.hideDismissed ? "1" : ""); } catch {} }
  else if (t.dataset.venue) { const v = t.dataset.venue; st.venuesOpen.has(v) ? st.venuesOpen.delete(v) : st.venuesOpen.add(v); }
  else if (t.dataset.open) { st.open = st.open === t.dataset.open ? null : t.dataset.open; st.picking = null; st.sharing = null; st.sent = null; }
  else return;
  render();
});
async function saveEmail(email) {
  if (st.busy) return; st.busy = true;
  try { S = await api("email", { email }); st.editEmail = false; }
  catch (e) { notify(e.info?.error === "email_taken" ? T.emailTaken : e.info?.error === "bad_email" ? T.badEmail : T.error); }
  st.busy = false; render();
}
async function friendAct(op, id) {
  if (st.busy) return; st.busy = true;
  try { S = await api("friend", { op, id }); if (S.result === "sent") notify(T.requestSent); }
  catch { notify(T.error); }
  st.busy = false; render();
}
function shareInvite() {
  const link = S.invite || "";
  const url = `https://t.me/share/url?url=${encodeURIComponent(link)}&text=${encodeURIComponent("Berlin Encore!")}`;
  if (tgApp?.openTelegramLink) tgApp.openTelegramLink(url);
  else if (navigator.share) navigator.share({ title: "Berlin Encore!", url: link }).catch(() => {});
  else navigator.clipboard?.writeText(link).then(() => notify(T.copied), () => {});
}
document.addEventListener("input", (e) => { if (e.target.id === "note") st.note = e.target.value; });
render(); load();
</script>
