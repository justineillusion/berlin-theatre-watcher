<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Berlin Encore!</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
:root{
  /* Noir sur blanc, police moderne (Manrope). Accents rares : rouge (actions, « ! » du nom), or (étoiles). */
  --bg:#ffffff; --card:#f2f2f5; --ink:#111214; --muted:#686e75;
  --line:#e6e6ea;
  --velvet:#d7263d; --velvet-ink:#ffffff; --gold:#e0a100; --gold-soft:#fff6dc;
  --ok:#2f9e5b; --sans:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; --serif:var(--sans);
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
body{padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
button{font-family:inherit;color:inherit;cursor:pointer}

/* En-tête : le nom comme sur l'affiche, puis onglets et filtres collants. */
.mast{padding:14px 16px 8px;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:baseline;gap:8px;line-height:1}
.brand small{display:none}
.brand b{font:800 24px var(--sans);letter-spacing:-.03em}
.brand b i{font-style:normal;color:var(--velvet)}
.mast time{font:500 13px var(--sans);color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.top{position:sticky;top:0;z-index:3;background:var(--bg);padding:4px 12px 8px;border-bottom:1px solid var(--line)}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);border-block:2px solid var(--ink);margin:0 -12px}

.tab{border:0;border-right:2px solid var(--ink);background:var(--bg);padding:10px 4px;font:800 12.5px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink);border-radius:0}
.tab:last-child{border-right:0}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.filters{display:flex;gap:6px;overflow-x:auto;padding:8px 12px 0;margin:0 -12px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--ink);background:var(--bg);font:700 12.5px var(--sans);letter-spacing:.04em;text-transform:uppercase;padding:6px 11px;border-radius:0}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
/* Temporel : du texte, pas des boîtes ; le choix actif est souligné. */
#whens{gap:18px;padding-top:10px}
#whens .chip{border:0;background:none;padding:2px 0;font:600 14px var(--sans);letter-spacing:0;text-transform:none;color:var(--muted)}
#whens .chip[aria-pressed="true"]{background:none;color:var(--ink);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:5px;box-shadow:none}

/* Liste : un jour = un intertitre en italique, une ligne = heure | titre. */
.day{display:flex;align-items:baseline;gap:8px;padding:20px 16px 6px;font:800 17px var(--sans);letter-spacing:-.01em;color:var(--ink)}
.day span{font:500 14px var(--sans);color:var(--muted)}
.day em{font:600 11px var(--sans);font-style:normal;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.item{margin:0 10px;border-radius:0}
.item.open{background:var(--bg);border:2px solid var(--ink);box-shadow:5px 5px 0 var(--ink);margin:8px 14px 12px 10px}
.row{display:grid;grid-template-columns:58px minmax(0,1fr) auto;gap:12px;align-items:start;padding:10px 8px;border:0;background:none;width:100%;text-align:left}
.when{font:700 15.5px var(--sans);font-variant-numeric:tabular-nums;text-align:right;padding-top:1px;line-height:1.1}
.when small{display:block;font:500 12px var(--sans);color:var(--muted);margin-top:3px}
.t{font:700 16px/1.3 var(--sans);letter-spacing:-.005em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.v{font-size:14px;color:var(--muted);margin-top:2px}
.v .sc{color:var(--ink);font-weight:700;white-space:nowrap}
.v .k{color:var(--gold)}
.badge{font-size:15px;padding-top:2px}
.social{font-size:14px;color:var(--ink);margin-top:4px}

/* Critique : visible tout de suite, en citation. */
.review{margin-top:6px;display:flex;flex-direction:column;gap:2px}
.stars{color:var(--gold);letter-spacing:.06em;font-size:15px}
.stars i{font-style:normal;color:var(--line)}
.quote{font:italic 500 15px/1.45 var(--sans);color:var(--ink);overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.quote.full{-webkit-line-clamp:unset;display:block}
.noreview{font-size:14px;color:var(--velvet)}

.detail{padding:0 14px 14px 72px;display:grid;grid-template-columns:minmax(0,1fr);gap:8px;font-size:15px;overflow-wrap:anywhere}
@media (max-width:420px){.detail{padding-left:18px}}
.badge.rate{font:600 13px var(--sans);color:var(--gold);white-space:nowrap}
.who{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.who .lbl{font-size:12.5px;color:var(--muted);margin-right:2px}
.sent{font-size:13px;color:var(--ok)}
.detail .m{color:var(--muted);font-size:14px}
.detail .syn{font:400 15px/1.5 var(--sans)}
.sect{font:600 11.5px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin-top:4px}
.mine{background:var(--gold-soft);border-left:3px solid var(--gold);border-radius:0;padding:10px 12px;display:grid;gap:4px}
.friend{display:grid;gap:1px;padding-left:10px;border-left:2px solid var(--line)}
.friend b{font:600 14px var(--sans)}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.act{border:1.5px solid var(--ink);background:var(--bg);font:700 13px var(--sans);letter-spacing:.02em;padding:8px 12px;border-radius:0;text-decoration:none;color:var(--ink)}
.act.on{background:var(--velvet);border-color:var(--velvet);color:var(--velvet-ink);box-shadow:3px 3px 0 var(--ink)}
.act.rate{padding:7px 9px;color:var(--gold);letter-spacing:.06em}
.act.rate.on{background:var(--gold);border-color:var(--gold);color:var(--card)}
.gone{opacity:.3;filter:grayscale(1);transition:opacity .35s}
.empty,.msg{padding:56px 28px;text-align:center;color:var(--muted);font:italic 500 16px var(--serif)}
.set{padding:8px 18px}
.set .line{padding:12px 0;border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left;display:flex;justify-content:space-between;gap:12px;font:400 14.5px var(--sans)}
.set .line span{color:var(--muted)}
.set .line.on span{color:var(--ok)}
.hint{color:var(--muted);font-size:13px;margin-top:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="mast"><div class="brand"><small>BERLIN</small><b>Berlin Encore<i>!</i></b></div><time id="today"></time></header>
<div class="top">
  <div class="tabs" role="tablist">
    <button class="tab" data-tab="prog" aria-selected="true"></button>
    <button class="tab" data-tab="mine" aria-selected="false"></button>
    <button class="tab" data-tab="set" aria-selected="false"></button>
  </div>
  <div class="filters" id="kinds"></div>
  <div class="filters" id="whens"></div>
</div>
<main id="list"><div class="msg">…</div></main>
<script>
const tgApp = window.Telegram && Telegram.WebApp;
const INIT = (tgApp && tgApp.initData) || "";
// Ouvert depuis une annonce du groupe (…/Programme?startapp=<fiche>) : cette fiche d'abord, ouverte.
const FOCUS = (tgApp && tgApp.initDataUnsafe && tgApp.initDataUnsafe.start_param) || "";
if (tgApp) {
  tgApp.ready(); tgApp.expand();
  try { tgApp.setHeaderColor("#ffffff"); tgApp.setBackgroundColor("#ffffff"); } catch {}
}

const L = {
  fr: { tabs:["À l'affiche","Mes sorties","Réglages"], all:"Tout", theatre:"Théâtre", film:"Ciné", expo:"Expos",
        week:"7 jours", month:"Ce mois", any:"Tout", today:"Aujourd'hui", tomorrow:"Demain", expos:"Expos en cours", exposNote:"par date de fin",
        star:"⭐ Envie", book:"🎟 Réservé", seen:"✅ Vu", ignore:"🙅 Pas pour moi", unignore:"↩︎ Finalement si", site:"Site ↗", pick:"Quelle séance ?", cancelBook:"Annuler la réservation",
        booked:"Réservé", wish:"Envies", done:"Vu", empty:"Rien dans ce créneau.", emptyMine:"Rien ici pour l'instant : ⭐ ce qui te tente.",
        venues:"Mes lieux", followed:"suivi", notFollowed:"—", setHint:"Pour changer : /reglages dans le chat.",
        outside:"Ouvre cette page depuis le bot Telegram.", notMember:"Commence par écrire au bot : ", error:"Impossible de charger. Réessaie.",
        myReview:"Ma critique", shared:"Depuis le groupe", send:"💌 Envoyer à…", sendGo:"Envoyer", sentTo:"Envoyé à", forWho:"Pour qui ?", me:"Moi", withF:"avec", tapToggle:"Touche un lieu pour le suivre ou ne plus le suivre.", language:"Langue", unfollowed:"pas suivi", writeReview:"✍️ Écrire ma critique", editReview:"✍️ Modifier", noReview:"✍️ Pas encore de critique",
        reviewInChat:"Le bot t'attend dans le chat : réponds-lui avec ta critique.", undoSeen:"↩︎ Pas vu", band:"La bande",
        dows:["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"], mons:["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"],
        smons:["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."], until:"jusqu'au", from:"dès le", end:"fin" },
  en: { tabs:["On now","My outings","Settings"], all:"All", theatre:"Theatre", film:"Cinema", expo:"Exhibitions",
        week:"7 days", month:"This month", any:"All", today:"Today", tomorrow:"Tomorrow", expos:"Exhibitions on", exposNote:"by closing date",
        star:"⭐ Want", book:"🎟 Booked", seen:"✅ Seen", ignore:"🙅 Not for me", unignore:"↩︎ Actually yes", site:"Site ↗", pick:"Which show?", cancelBook:"Cancel booking",
        booked:"Booked", wish:"Wishlist", done:"Seen", empty:"Nothing in this window.", emptyMine:"Nothing yet: ⭐ what tempts you.",
        venues:"My venues", followed:"followed", notFollowed:"—", setHint:"To change: /settings in the chat.",
        outside:"Open this page from the Telegram bot.", notMember:"Message the bot first: ", error:"Couldn't load. Try again.",
        myReview:"My review", shared:"From the group", send:"💌 Send to…", sendGo:"Send", sentTo:"Sent to", forWho:"For whom?", me:"Me", withF:"with", tapToggle:"Tap a venue to follow or unfollow it.", language:"Language", unfollowed:"not followed", writeReview:"✍️ Write my review", editReview:"✍️ Edit", noReview:"✍️ No review yet",
        reviewInChat:"The bot is waiting in the chat: reply with your review.", undoSeen:"↩︎ Not seen", band:"The gang",
        dows:["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"], mons:["January","February","March","April","May","June","July","August","September","October","November","December"],
        smons:["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"], until:"until", from:"from", end:"ends" },
};
let T = L.fr, S = null;
const st = { tab:"prog", kind:"all", when:"month", open:null, picking:null, sharing:null, sel:new Set(), withs:new Set(), sent:null, busy:false, focus:FOCUS };
if (FOCUS) st.open = FOCUS;
const ICON = { theatre:"🎭", expo:"🏛", film:"🎬" };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const berlin = (d = new Date()) => new Intl.DateTimeFormat("en-CA", { timeZone:"Europe/Berlin", year:"numeric", month:"2-digit", day:"2-digit" }).format(d);
const TODAY = berlin(), TOMORROW = berlin(new Date(Date.now() + 864e5));
const plus = (n) => berlin(new Date(Date.now() + n * 864e5));
const LIMIT = { week: plus(7), month: plus(31), all: "9999" };

function next(x) {
  if (x.kind === "expo") return x.start && x.start > TODAY ? x.start : TODAY;
  return (x.dates || []).slice().sort().find((d) => d.slice(0, 10) >= TODAY) || null;
}
const dt = (d) => new Date(d.slice(0, 10) + "T12:00:00Z");
const cap = (w) => w.charAt(0).toUpperCase() + w.slice(1);
function dayLabel(d) {
  const k = d.slice(0, 10), t = dt(d);
  const full = `${T.dows[t.getUTCDay()]} ${t.getUTCDate()} ${T.mons[t.getUTCMonth()]}`;
  if (k === TODAY) return `${T.today} · ${full}`;
  if (k === TOMORROW) return `${T.tomorrow} · ${full}`;
  return cap(full);
}
const shortDay = (d) => `${+d.slice(8, 10)} ${T.smons[+d.slice(5, 7) - 1]}`;
const state = (x) => !x.me ? "" : x.me.status === "seen" ? "seen" : x.me.status === "ignored" ? "ignored" : x.me.booked ? "booked" : x.me.star ? "star" : "";
const badge = (x) => state(x) === "seen" && x.me.rating ? `<span class="badge rate">${x.me.rating}★</span>` : `<span class="badge">${{ star:"⭐", booked:"🎟", seen:"✅" }[state(x)] || ""}</span>`;
const stars = (n) => n ? `<span class="stars">${"★".repeat(n)}<i>${"★".repeat(5 - n)}</i></span>` : "";

/** Lignes utiles de la fiche du bot (HTML Telegram) : lieu/salle, auteur, langue, critiques presse, résumé. */
function facts(x) {
  const txt = (x.text || "").replace(/<br\s*\/?>/g, "\n").replace(/<[^>]*>?/g, "");
  const d = document.createElement("textarea"); d.innerHTML = txt; const lines = d.value.split("\n").map((l) => l.trim());
  const pick = (p) => lines.filter((l) => l.startsWith(p));
  // Films : « (2026, Réalisateur) » sur la 1re ligne, « ★ 6,9 SC » / « ★ 3,8 LB » sur une ligne à part.
  const credits = x.kind === "film" ? ((lines[0] || "").match(/\(([^)]*\d{4}[^)]*)\)\s*$/) || [])[1] || "" : "";
  const rating = lines.find((l) => /^★\s*\d/.test(l)) || "";
  return { meta: [...(credits ? ["🎬 " + credits] : []), ...pick("📍"), ...pick("✍️"), ...pick("🗣"), ...pick("📰")],
           rating, syn: pick("📝").map((l) => l.replace(/^📝\s*/, "")).join(" ").slice(0, 420) };
}

async function api(path, extra = {}) {
  const r = await fetch("/app/api/" + path, { method:"POST", headers:{ "content-type":"application/json" }, body: JSON.stringify({ initData: INIT, focus: FOCUS, ...extra }) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(j.error || r.status), { info: j });
  return j;
}
async function load() {
  if (!INIT) { $("list").innerHTML = `<div class="msg">${esc(T.outside)}</div>`; return; }
  try { S = await api("state"); T = L[S.lang] || L.fr; document.documentElement.lang = S.lang; render(); }
  catch (e) {
    $("list").innerHTML = e.info?.error === "not_member"
      ? `<div class="msg">${esc(T.notMember)}<a href="https://t.me/${esc(e.info.bot)}">@${esc(e.info.bot)}</a></div>`
      : `<div class="msg">${esc(T.error)}</div>`;
  }
}
async function act(op, id, arg, extra = {}) {
  if (st.busy) return; st.busy = true;
  // « Pas pour moi » : la fiche se grise, puis sort du programme (retrouvable via /ignores dans le chat).
  if (op === "x") {
    document.querySelector(`.item[data-item="${id}"]`)?.classList.add("gone");
    await new Promise((r) => setTimeout(r, 400));
    st.open = null;
  }
  try { tgApp?.HapticFeedback?.selectionChanged(); S = await api(extra.path || "act", { op, id, arg, ...extra.body }); if (S.sent) st.sent = { id, names: S.sent }; T = L[S.lang] || L.fr; document.documentElement.lang = S.lang; }
  catch { tgApp?.showAlert?.(T.error); }
  st.busy = false; st.picking = null; st.sharing = null; st.sel.clear(); st.withs.clear(); render();
  // ✍️ : la critique s'écrit dans le chat, en réponse à l'invitation que le bot vient d'envoyer.
  if (op === "w" && tgApp) tgApp.showAlert(T.reviewInChat, () => tgApp.close());
}

function chips(el, items, key) {
  el.innerHTML = items.map(([v, l]) => `<button class="chip" data-${key}="${v}" aria-pressed="${st[key] === v}">${l}</button>`).join("");
}
function socialLine(x) {
  const f = x.friends || []; const parts = [];
  const mine = x.me && x.me.booked;
  const together = mine ? f.filter((p) => p.booked === mine).map((p) => esc(p.name)) : [];
  if (together.length) parts.push(`🎟 ${esc(T.withF)} ${together.join(", ")}`);
  const want = f.filter((p) => (p.star || p.booked) && !p.seen && !(mine && p.booked === mine)).map((p) => esc(p.name) + (p.booked ? " 🎟" : ""));
  if (want.length) parts.push("⭐ " + want.join(", "));
  const seen = f.filter((p) => p.seen).map((p) => esc(p.name) + (p.rating ? ` <span class="stars">${"★".repeat(p.rating)}</span>` : ""));
  if (seen.length) parts.push("✅ " + seen.join(", "));
  return parts.length ? `<div class="social">${parts.join(" · ")}</div>` : "";
}
function reviewBlock(x, full) {
  const me = x.me || {};
  if (state(x) !== "seen") return "";
  if (!me.rating && !me.comment) return `<div class="review"><span class="noreview">${esc(T.noReview)}</span></div>`;
  return `<div class="review">${stars(me.rating)}${me.comment ? `<div class="quote${full ? " full" : ""}">« ${esc(me.comment)} »</div>` : `<span class="noreview">${esc(T.noReview)}</span>`}</div>`;
}
function whenCell(x) {
  if (x.kind === "expo") return ICON.expo;
  const n = next(x);
  if (st.tab === "prog") return `${n ? n.slice(11) : "—"}<small>${ICON[x.kind]}</small>`;
  const d = (x.me && x.me.booked) || n || (x.dates || []).slice().sort().pop();
  if (!d) return ICON[x.kind];
  return `${+d.slice(8, 10)} ${esc(T.smons[+d.slice(5, 7) - 1])}<small>${esc(T.dows[dt(d).getUTCDay()].slice(0, 3))}${d.length > 10 ? " " + d.slice(11, 16) : ""}</small>`;
}
function item(x) {
  const open = st.open === x.id, s = state(x), me = x.me || {};
  let h = `<div class="item${open ? " open" : ""}" data-item="${x.id}"><button class="row" data-open="${x.id}" aria-expanded="${open}">
    <div class="when">${whenCell(x)}</div>
    <div><div class="t">${esc(x.title)}</div><div class="v">${esc(x.venue)}${x.kind === "expo" && x.end ? ` · ${esc(T.until)} ${esc(shortDay(x.end))}` : ""}${facts(x).rating ? ` · <b class="sc">${esc(facts(x).rating)}</b>` : ""}</div>${s === "seen" ? reviewBlock(x, false) : socialLine(x)}</div>
    ${badge(x)}</button>`;
  if (!open) return h + "</div>";
  const upcoming = (x.dates || []).filter((d) => d.slice(0, 10) >= TODAY).sort();
  const dates = x.kind === "expo"
    ? [x.start && x.start > TODAY ? `${T.from} ${shortDay(x.start)}` : "", x.end ? `${T.until} ${shortDay(x.end)}` : ""].filter(Boolean).join(", ")
    : upcoming.slice(0, 8).map((d) => `${dayLabel(d)} ${d.slice(11)}`).join(" · ");
  const f = facts(x);
  h += `<div class="detail">`;
  if (s === "seen") {
    h += `<div class="mine"><div class="sect">${esc(T.myReview)}</div>${me.rating || me.comment ? reviewBlock(x, true) : ""}
      <div class="acts">${[1,2,3,4,5].map((n) => `<button class="act rate ${me.rating === n ? "on" : ""}" data-act="r" data-id="${x.id}" data-arg="${n}">${n}★</button>`).join("")}</div>
      <div class="acts"><button class="act" data-act="w" data-id="${x.id}">${me.comment ? T.editReview : T.writeReview}</button>
      <button class="act" data-act="u" data-id="${x.id}">${T.undoSeen}</button></div></div>`;
  }
  const friends = (x.friends || []).filter((p) => p.seen && (p.rating || p.comment));
  if (friends.length) h += `<div class="sect">${esc(T.band)}</div>` + friends.map((p) =>
    `<div class="friend"><b>${esc(p.name)} ${stars(p.rating)}</b>${p.comment ? `<div class="quote">« ${esc(p.comment)} »</div>` : ""}</div>`).join("");
  if (s !== "seen" && dates) h += `<div>🗓 ${esc(dates)}</div>`;
  if (me.booked && s !== "seen") h += `<div>🎟 ${esc(dayLabel(me.booked))} ${esc(me.booked.slice(11))}</div>`;
  if (f.rating) h += `<div><b class="sc">${esc(f.rating)}</b></div>`;
  h += f.meta.map((l) => `<div class="m">${esc(l)}</div>`).join("");
  if (f.syn) h += `<div class="syn">${esc(f.syn)}${f.syn.length >= 420 ? "…" : ""}</div>`;
  const people = S.people || [];
  if (st.sent && st.sent.id === x.id && st.sent.names.length) h += `<div class="sent">✓ ${esc(T.sentTo)} ${esc(st.sent.names.join(", "))}</div>`;
  if (st.sharing === x.id) {
    h += `<div class="sect">${esc(T.send.replace("…", ""))}</div><div class="who">${people.map((p) =>
      `<button class="act ${st.sel.has(p.id) ? "on" : ""}" data-sel="${p.id}">${esc(p.name)}</button>`).join("")}
      <button class="act on" data-share="${x.id}" ${st.sel.size ? "" : "disabled"}>${esc(T.sendGo)} ↗</button></div>`;
  } else if (st.picking === x.id) {
    if (people.length) h += `<div class="who"><span class="lbl">${esc(T.forWho)}</span><button class="act on" disabled>${esc(T.me)}</button>${people.map((p) =>
      `<button class="act ${st.withs.has(p.id) ? "on" : ""}" data-with="${p.id}">+ ${esc(p.name)}</button>`).join("")}</div>`;
    h += `<div class="sect">${esc(T.pick)}</div><div class="acts">${upcoming.slice(0, 12).map((d) =>
      `<button class="act" data-act="bd" data-id="${x.id}" data-arg="${d.replace(/\D/g, "").slice(0, 12)}">${esc(dayLabel(d))} ${d.slice(11)}</button>`).join("")}
      ${me.booked ? `<button class="act" data-act="bx" data-id="${x.id}">${esc(T.cancelBook)}</button>` : ""}</div>`;
  } else if (s !== "seen") {
    h += `<div class="acts">
      <button class="act ${me.star ? "on" : ""}" data-act="i" data-id="${x.id}">${T.star}</button>
      ${x.kind !== "expo" && upcoming.length ? `<button class="act ${me.booked ? "on" : ""}" data-pick="${x.id}">${T.book}</button>` : ""}
      <button class="act" data-act="v" data-id="${x.id}">${T.seen}</button>
      ${s === "ignored" ? `<button class="act on" data-act="u" data-id="${x.id}">${T.unignore}</button>` : `<button class="act" data-act="x" data-id="${x.id}">${T.ignore}</button>`}
      ${(S.people || []).length ? `<button class="act" data-sharing="${x.id}">${T.send}</button>` : ""}
      ${x.url ? `<a class="act" href="${esc(x.url)}" data-link="1">${T.site}</a>` : ""}</div>`;
  } else if (x.url) {
    h += `<div class="acts"><a class="act" href="${esc(x.url)}" data-link="1">${T.site}</a></div>`;
  }
  return h + "</div></div>";
}
const dayHead = (label, note = "") => { const [a, b] = String(label).split(" · "); return `<div class="day">${esc(a)}${b ? ` <span>${esc(b)}</span>` : ""}${note ? ` <span>${esc(note)}</span>` : ""}</div>`; };
function render() {
  const now = dt(TODAY);
  $("today").textContent = `${T.dows[now.getUTCDay()].slice(0, 3)}. ${now.getUTCDate()} ${T.smons[now.getUTCMonth()]}`;
  document.querySelectorAll(".tab").forEach((b, i) => { b.textContent = T.tabs[i]; b.setAttribute("aria-selected", b.dataset.tab === st.tab); });
  const K = $("kinds"), W = $("whens"), list = $("list");
  if (!S) return;
  K.hidden = st.tab === "set"; W.hidden = st.tab !== "prog";
  if (st.tab === "set") {
    list.innerHTML = `<div class="set">${dayHead(T.venues)}${S.venues.map((v) =>
      `<button class="line${v.followed ? " on" : ""}" data-act="s" data-id="${esc(v.id)}">${ICON[v.kind === "cinema" ? "film" : v.kind] || "🎭"} ${esc(v.name)}<span>${v.followed ? "✓ " + esc(T.followed) : esc(T.unfollowed)}</span></button>`).join("")}
      <p class="hint">${esc(T.tapToggle)}</p>
      ${dayHead(T.language)}<div class="acts">${[["fr", "🇫🇷 Français"], ["en", "🇬🇧 English"]].map(([c, l]) =>
        `<button class="act ${S.lang === c ? "on" : ""}" data-act="l" data-id="${c}">${l}</button>`).join("")}</div></div>`;
    return;
  }
  chips(K, [["all", T.all], ["theatre", "🎭 " + T.theatre], ["film", "🎬 " + T.film], ["expo", "🏛 " + T.expo]], "kind");
  chips(W, [["week", T.week], ["month", T.month], ["all", T.any]], "when");
  let xs = S.items.filter((x) => st.kind === "all" || x.kind === st.kind);
  let h = "";
  if (st.tab === "prog") {
    // Ce que j'ai vu ou écarté n'est plus reproposé (sauf la fiche ouverte, le temps de voir l'effet du clic).
    xs = xs.filter((x) => (!["seen", "ignored"].includes(state(x)) || x.id === st.open) && next(x) && next(x).slice(0, 10) < LIMIT[st.when]);
    const focused = st.focus && S.items.find((x) => x.id === st.focus);
    if (focused) { h += dayHead(T.shared) + item(focused); xs = xs.filter((x) => x.id !== st.focus); }
    const shows = xs.filter((x) => x.kind !== "expo").sort((a, b) => next(a).localeCompare(next(b)));
    const expos = xs.filter((x) => x.kind === "expo").sort((a, b) => (a.end || "9").localeCompare(b.end || "9"));
    let cur = "";
    for (const x of shows) { const d = dayLabel(next(x)); if (d !== cur) { h += dayHead(d); cur = d; } h += item(x); }
    if (expos.length) h += dayHead(T.expos, T.exposNote) + expos.map(item).join("");
    list.innerHTML = h || `<div class="empty">${esc(T.empty)}</div>`;
  } else {
    for (const [k, l] of [["booked", T.booked], ["star", T.wish], ["seen", T.done]]) {
      let g = xs.filter((x) => state(x) === k);
      g = k === "seen" ? g.sort((a, b) => (b.me.at || "").localeCompare(a.me.at || "")).slice(0, 40)
        : g.sort((a, b) => (k === "booked" ? a.me.booked : next(a) || "9").localeCompare(k === "booked" ? b.me.booked : next(b) || "9"));
      if (g.length) h += dayHead(`${l} · ${g.length}`) + g.map(item).join("");
    }
    list.innerHTML = h || `<div class="empty">${esc(T.emptyMine)}</div>`;
  }
}
document.addEventListener("click", (e) => {
  const a = e.target.closest("a[data-link]");
  if (a) { if (tgApp?.openLink) { e.preventDefault(); tgApp.openLink(a.href); } return; }
  const t = e.target.closest("button"); if (!t) return;
  if (t.dataset.tab) { st.tab = t.dataset.tab; st.open = null; window.scrollTo?.(0, 0); }
  else if (t.dataset.kind) st.kind = t.dataset.kind;
  else if (t.dataset.when) st.when = t.dataset.when;
  else if (t.dataset.pick) { st.picking = st.picking === t.dataset.pick ? null : t.dataset.pick; st.sharing = null; st.withs.clear(); }
  else if (t.dataset.sharing) { st.sharing = st.sharing === t.dataset.sharing ? null : t.dataset.sharing; st.picking = null; st.sel.clear(); }
  else if (t.dataset.sel) { const n = +t.dataset.sel; st.sel.has(n) ? st.sel.delete(n) : st.sel.add(n); }
  else if (t.dataset.with) { const n = +t.dataset.with; st.withs.has(n) ? st.withs.delete(n) : st.withs.add(n); }
  else if (t.dataset.share) return void act("share", t.dataset.share, "", { path: "share", body: { to: [...st.sel] } });
  else if (t.dataset.act === "bd") return void act("bd", t.dataset.id, t.dataset.arg, { body: { with: [...st.withs] } });
  else if (t.dataset.act) return void act(t.dataset.act, t.dataset.id, t.dataset.arg);
  else if (t.dataset.open) { st.open = st.open === t.dataset.open ? null : t.dataset.open; st.picking = null; st.sharing = null; st.sent = null; }
  else return;
  render();
});
render(); load();
</script>
