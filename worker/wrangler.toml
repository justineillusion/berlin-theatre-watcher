name = "theatre-bot"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# Cron (UTC) : ouvertures de vente — la veille 19:00 et à l'heure d'ouverture (Berlin).
# L'app web : https://berlinencore.app (domaine sur ce compte Cloudflare) ; « / » mène à /app.
routes = [{ pattern = "berlinencore.app", custom_domain = true }]
# …et l'adresse workers.dev reste active : webhook Telegram + scraper GitHub (BOT_API_URL) l'utilisent.
workers_dev = true

[triggers]
crons = ["*/15 * * * *"]

[vars]
# À remplir : ton chat_id (= TELEGRAM_CHAT_ID actuel) et le @ du bot, sans @.
OWNER_CHAT_ID = "2128088613"
BOT_USERNAME = "Justine_theatre_bot"
# Nom court de la mini-app (BotFather /newapp) : t.me/<bot>/<nom>?startapp=<fiche>
APP_SHORT_NAME = "Programme"
# Adresse publique de l'app web (liens des emails de connexion).
APP_URL = "https://berlinencore.app"
# Web Push : clé publique VAPID (la privée est un secret : VAPID_PRIVATE_KEY).
VAPID_PUBLIC_KEY = "BHFwWuXrB0AN7b9VEYEu3cOC53p4Caz16hrwF_7oVLVpo-BY2jWgYkV5zQhO29OdA-p7JoR_Xr_rqmt6yfwqx2w"
# Expéditeur des emails de connexion (domaine vérifié chez Resend).
MAIL_FROM = "Berlin Encore! <bonjour@berlinencore.app>"

[[d1_databases]]
binding = "DB"
database_name = "theatre-bot"
# Donné par : npx wrangler d1 create theatre-bot (les zéros servent aux tests locaux)
database_id = "7602c36b-2c7b-4168-954d-892f1eac3c31"

# Secrets (jamais dans ce fichier) :
#   npx wrangler secret put BOT_TOKEN        (token @BotFather)
#   npx wrangler secret put API_TOKEN        (inventé, partagé avec GitHub Actions)
#   npx wrangler secret put WEBHOOK_SECRET   (inventé, lettres/chiffres)
