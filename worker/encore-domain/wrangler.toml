# Adresse « berlin-encore.pages.dev » pour l'app web : un relais (Cloudflare Pages, gratuit)
# vers le Worker theatre-bot, par service binding. Rien d'autre ne tourne ici (pas de cron).
#   npx wrangler pages deploy        (depuis ce dossier)
name = "berlin-encore"
pages_build_output_dir = "public"
compatibility_date = "2026-10-01"

[[services]]
binding = "BOT"
service = "theatre-bot"
