ined\",\"nonce\":\"$undefined\"}],[\"$\",\"link\",\"1\",{\"rel\":\"stylesheet\",\"href\":\"/_next/static/chunks/0mpuvr14b_kta.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}],[\"$\",\"link\",\"2\",{\"rel\":\"stylesheet\",\"href\":\"/_next/static/chunks/30-j9_sg87c9d.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}]]],\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}]}]}]}]\nb:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n8:null\nd:[]\n12:I[572767,[\"/_next/static/chunks/0fsaq-nd9henk.js\",\"/_next/static/chunks/3exs41sbne82g.js\",\"/_next/static/chunks/0ipoi_yld9mje.js\",\"/_next/static/chunks/201_t1lbvu6t2.js\",\"/_next/static/chunks/29os5iwm8_or5.js\",\"/_next/static/chunks/1f6g5e23zuu7g.js\",\"/_next/static/chunks/1841j6urdc77o.js\",\"/_next/static/chunks/2z2x12vdhb6-x.js\"],\"PageProviders\"]\n13:Tac2,\u003cp\u003e\u003ci\u003eMAMI\u003c/i\u003e  revolves around a word that means more than a person. Mother – in Mario Banushi’s work this word signifies origin and absence at once, care and burden, closeness and loss. \u003cspan lang=\"EN-US\" dir=\"ltr\"\u003eThe director and performer was born in Greece\u0026nbsp;but spent part of his early childhood in Albania with his grandmother – a common practice at the time, particularly in large families, due to economic hardship – before returning to Greece at the age of six.\u0026nbsp;In his latest creation, Banushi condenses personal memories into a poetic exploration of the relationships that bring life into being and shape it. \u003c/span\u003e\u003ci\u003eMAMI\u003c/i\u003e  i\u003cspan lang=\"EN-US\" dir=\"ltr\"\u003es a tribute to the women who raised us – and to the ambivalences bound up with this inheritance.\u003c/span\u003e\u003c/p\u003e\u003cp\u003eDrawing on his own experiences, Banushi creates a form of visual theatre of memory. The stage becomes a space of remembrance, familiar and uncanny at the same time. In silent, highly concentrated images, a chronicle of growing up unfolds – from early imprints of childhood through first experiences of love to the discovery of one’s own desire. Tenderness and loss, birth and impermanence, care and separation exist in a constant state of tension. Time appears stretched, suspended, as if following the inner logic of memory rather than a linear narrative.\u003c/p\u003e\u003cp\u003eA defining feature of Banushi’s work is the absence of spoken language. Bodies, gestures, music, light and colour carry the narrative. His productions emerge from an intense visual process and function like immaterial books that ask to be experienced rather than read. His stage spaces resemble estranged in-between worlds in which reality and symbolism imperceptibly merge. Rituals, offerings and everyday materials combine to form a poetics of the real, in which bodies, in their raw and unprotected presence, become images of striking emotional clarity. The music, strongly influenced by the Balkans, reinforces the ritual dimension of the performance, lending it an archaic yet contemporary quality.\u003c/p\u003e\u003cp\u003eMario Banushi has gained international recognition for his wordless, visually powerful theatre works, for which he was awarded the Silver Lion at the Venice Biennale in 2026. With his debut \u003ci\u003eRagada\u003c/i\u003e and the subsequent productions \u003ci\u003eGoodbye, Lindita\u003c/i\u003e and \u003ci\u003eTaverna Miresia – Mario Bella Anastasia\u003c/i\u003e, he developed a distinctive form of visual theatre in which personal experience, ritual and collective memory intertwine. With \u003ci\u003eMAMI\u003c/i\u003e, he continues this artistic trajectory, turning – after works shaped by farewell and mourning – towards life itself: towards birth, transmission, and the question of who carries whom, and at what cost.\u003c/p\u003e14:Tbdd,\u003cp\u003e\u003ca href=\"${link:{uuid:{1349cdd2-f016-4593-9834-9a48fee9f175},repository:{artists},path:{/bfs-mediathek/B/mario-banushi}}}\"\u003e\u003cspan class=\"cast-name\"\u003eMario Banushi\u003c/span\u003e\u003c/a\u003e –\u003cspan class=\"cast-info\"\u003e Concept, Director\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"cast-name\"\u003eVasiliki Driva, Dimitris Lagos, Eftychia Stefanou, Angeliki Stellatou, Ennea Vangelis, Panagiota Υiagli\u0026nbsp; \u003c/span\u003e–\u003cspan class=\"cast-info\"\u003e Performance\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"cast-name\"\u003eSotiris Melanos\u003c/span\u003e –\u003cspan class=\"cast-info\"\u003e Set and Costume Design\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"cast-name\"\u003eJeph Vanger\u003c/span\u003e –\u003cspan class=\"cast-info\"\u003e Original Music and Sound Design\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"cast-name\"\u003eStephanos Droussiotis\u003c/span\u003e –\u003cspan class=\"cast-info\"\u003e Lighting Design, Associate Dramaturg\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"cast-name\"\u003eAimilios Arapoglou\u003c/span\u003e, \u003cspan class=\"cast-name\"\u003eThanasis Deligiannis\u003c/span\u003e –\u003cspan class=\"cast-info\"\u003e Artistic Collaborators\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"cast-name\"\u003eTheodora Patiti\u003c/span\u003e –\u003cspan class=\"cast-info\"\u003e Assistant Director\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan class=\"cast-name\"\u003eNikos Mavrakis\u003c/span\u003e –\u003cspan class=\"cast-info\"\u003e International Relations, Tour Management\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"cast-name\"\u003eRena Andreadaki\u003c/span\u003e \u0026amp; \u003cspan class=\"cast-name\"\u003eChristos Christopoulos (TooFarEast)\u003c/span\u003e –\u003cspan class=\"cast-info\"\u003e Creation Period Production Management\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"cast-name\"\u003eIoanna Papakosta (TooFarEast)\u003c/span\u003e –\u003cspan class=\"cast-info\"\u003e Line Production, Tour Production Manager\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"cast-name\"\u003eKonstantina Douka Gkosi (TooFarEast)\u003c/span\u003e –\u003cspan class=\"cast-info\"\u003e Auditions and Residency Coordinator, Tour Production Manager\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan class=\"cast-name\"\u003eMarietta Pavlaki\u003c/span\u003e –\u003cspan class=\"cast-info\"\u003e Lighting Designer on Tour\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"cast-name\"\u003eKostas Chaidos\u003c/span\u003e –\u003cspan class=\"cast-info\"\u003e Sound Engineer on Tour\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"cast-name\"\u003eSofia Theodorou\u003c/span\u003e –\u003cspan class=\"cast-info\"\u003e Set Assistant\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"cast-name\"\u003eNikoleta Anastasiadou\u003c/span\u003e –\u003cspan class=\"cast-info\"\u003e Costumes Assistant\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan class=\"cast-name\"\u003eMichalis Lagkouvardos\u003c/span\u003e –\u003cspan class=\"cast-info\"\u003e Set Construction\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"cast-name\"\u003eAlaxouzoi brothers\u003c/span\u003e, \u003cspan class=\"cast-name\"\u003eAlexandros Loggos\u003c/span\u003e –\u003cspan class=\"cast-info\"\u003e Special Constructions\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"cast-name\"\u003eGiorgos Ierapetritis\u003c/span\u003e –\u003cspan class=\"cast-info\"\u003e Special Lighting Constructions\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"cast-name\"\u003eAristidis Kreatsoulas (TooFarEast)\u003c/span\u003e –\u003cspan class=\"cast-info\"\u003e Rehearsal Technical Coordination, Stage Technician on Tour\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"cast-name\"\u003eKonstantinos Mavrantzas\u003c/span\u003e –\u003cspan class=\"cast-info\"\u003e Rehearsal Electrician\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"cast-name\"\u003eStefanos Ntaoulas\u003c/span\u003e, \u003cspan class=\"cast-name\"\u003eIason Papantoniou\u003c/span\u003e, \u003cspan class=\"cast-name\"\u003eGrigoris Zkeris\u003c/span\u003e, \u003cspan class=\"cast-name\"\u003eParis Asimakopoulos\u003c/span\u003e –\u003cspan class=\"cast-info\"\u003e Rehearsal Technical Support\u003c/span\u003e\u003c/p\u003e15:Tf65,\u003cp\u003eDer schnellste Weg zu unseren Festivals, Ausstellungen und Programmreihen: \u003cbr\u003e \u003ci\u003eThe quickest way to our festivals, exhibitions and programme series:\u003c/i\u003e\u003c/p\u003e\u003cul\u003e \u003cli data-list-item-id=\"ee454f6bba6dcd661c2b7edd414eab7d7\"\u003e\u003ca href=\"${link:{uuid:{55f81055-59ad-4284-b7c4-a3019f95610e},repository:{website},path:{/bfs-de/gropius-bau}}}\"\u003eGropius\u0026nbsp;Bau\u003c/a\u003e\u003c/li\u003e \u003cli data-list-item-id=\"ec3886f5d29567ce78cd06f4459b03473\"\u003e\u003ca href=\"${link:{uuid:{26e11d22-b6fe-47cb-a18a-b6b29d9136a7},repository:{website},path:{/bfs-de/jazzfest-berlin}}}\"\u003eJazzfest\u0026nbsp;Berlin\u003c/a\u003e\u003c/li\u003e \u003cli data-list-item-id=\"e7d38f564fd4f22768b7696b15d811747\"\u003e\u003ca href=\"${link:{uuid:{3295227e-266e-442b-9094-c484230f623f},repository:{website},path:{/bfs-de/maerzmusik}}}\"\u003eMaerzMusik\u003c/a\u003e\u003c/li\u003e \u003cli data-list-item-id=\"e1e95b4bfbcd378aa4524f454dbebb834\"\u003e\u003ca href=\"${link:{uuid:{6633a1a2-5791-4d37-85a7-e0b06fa105f2},repository:{website},path:{/bfs-de/musikfest-berlin}}}\"\u003eMusikfest\u0026nbsp;Berlin\u003c/a\u003e\u003c/li\u003e \u003cli data-list-item-id=\"ef4224b0cc83c57bc92c55f992207d3c8\"\u003e\u003ca href=\"${link:{uuid:{af5afe78-6bdd-4e71-aae7-9589124d87bd},repository:{website},path:{/bfs-de/performing-arts-season}}}\"\u003ePerforming Arts Season\u003c/a\u003e\u003c/li\u003e \u003cli data-list-item-id=\"e927e163debc8206c889eccbfb72ad422\"\u003e\u003ca href=\"${link:{uuid:{d3bfb8fb-6de2-4f18-b845-2f5b1362d57a},repository:{website},path:{/bfs-de/reflexe-und-reflexionen}}}\"\u003eReflexe \u0026amp; Reflexionen\u003c/a\u003e\u003c/li\u003e \u003cli data-list-item-id=\"e26c576ec8e3f8056f4f5261c92e32083\"\u003e\u003ca href=\"${link:{uuid:{fa672cb2-855e-469b-8212-4dec36fe248c},repository:{website},path:{/bfs-de/theatertreffen}}}\"\u003eTheatertreffen\u003c/a\u003e\u003c/li\u003e \u003cli data-list-item-id=\"e34b20e95a0de794ca7829669ed579a6e\"\u003e\u003ca href=\"${link:{uuid:{4edae657-6eda-4c0e-bca1-0ce354742029},repository:{website},path:{/bfs-de/treffen-junge-szene}}}\"\u003eTreffen junge Szene\u003c/a\u003e\u0026nbsp;\u003c/li\u003e \u003cli data-list-item-id=\"ed174faadf412b4d837a031d2e8f30452\"\u003e\u003ca href=\"${link:{uuid:{e2d52b51-5741-4e56-9a32-a573fa7dd49c},repository:{website},provider:{jcr},path:{/bfs-de/what-if-berlin}}}\"\u003eWhat If Berlin\u003c/a\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eDar\u0026uuml;ber hinaus geht es hier zu den folgenden Seiten: \u003cbr\u003e \u003ci\u003eIn addition, click here to go to the following pages:\u003c/i\u003e\u003c/p\u003e\u003cul\u003e \u003cli data-list-item-id=\"eb1db6edbdd7a318fcdc3a5ef71e41261\"\u003e\u003ca href=\"${link:{uuid:{f9e53754-08cb-44b3-8aef-d1bc11968779},repository:{website},path:{/bfs-de}}}\"\u003eStartseite\u003c/a\u003e\u0026nbsp;(Home Page)\u003c/li\u003e \u003cli data-list-item-id=\"ee619b8d5116d690c4537beee86492b9b\"\u003e\u003ca href=\"${link:{uuid:{9e5a1240-2f96-4b76-be7b-a8c3f2a22bbd},repository:{website},path:{/bfs-de/programm/kalender}}}\"\u003eKalender\u003c/a\u003e\u0026nbsp;(Calendar)\u003c/li\u003e \u003cli data-list-item-id=\"efc8c043d54cdfd6075a831059de18c2d\"\u003e\u003ca href=\"${link:{uuid:{1c781ff7-4d77-4925-af10-b8f846eb2b8a},repository:{website},path:{/bfs-de/besuch/anfahrt-kontakt}}}\"\u003eAnfahrt \u0026amp; Kontakt\u003c/a\u003e\u0026nbsp;(Visit \u0026amp; Contact)\u003c/li\u003e \u003cli data-list-item-id=\"e8dc7899fbbce6bd907a56a52e3dcc616\"\u003e\u003ca href=\"https://tickets.kbb.eu/kbb.webshop/webticket/shop?language=de\"\u003eWebshop\u003c/a\u003e\u0026nbsp;(Online Shop)\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eFalls das auch nicht hilft, finden Sie unsere Veranstaltungen auch auf externen Seiten: \u003cbr\u003e \u003ci\u003eIf that doesn't help you can find our event on external pages:\u003c/i\u003e\u003c/p\u003e\u003cul\u003e \u003cli data-list-item-id=\"ecc252ab7b8fa0d19c219ec2beef08d14\"\u003e\u003ca href=\"http://www.berlin-buehnen.de/de/spielplan/?locations=80\"\u003eBerlin B\u0026uuml;hnen\u003c/a\u003e\u003c/li\u003e \u003cli data-list-item-id=\"eb55996ae0028493f01e1190c96e3ff9f\"\u003e\u003ca href=\"http://www.museumsportal-berlin.de/de/museen/martin-gropius-bau/#section-exhibitions\"\u003eMuseumsportal Berlin\u003c/a\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eM\u0026ouml;chten Sie uns helfen? Schicken Sie uns gerne eine Nachricht mit dem Hinweis, wo der Fehler aufgetreten ist: \u003cbr\u003e \u003ci\u003eYou want to help us? Please send us a message with a hint where the error occurred:\u003c/i\u003e \u003cbr\u003e \u003ca href=\"mailto:[[contact:mail:MEXOXrqzmRjHC6TtZujbfw-nZzB8RegITiT-SlqUpsgrK-a8CKXxBQ55O2omn7wM4h7HfC6X3dLUV8txEo9MEioxhV8]]\"\u003e[[contact:mail:MEXOXrqzmRjHC6TtZujbfw-nZzB8RegITiT-SlqUpsgrK-a8CKXxBQ55O2omn7wM4h7HfC6X3dLUV8txEo9MEioxhV8]]\u003c/a\u003e\u003c/p\u003e16:T53f,\u003cp\u003eFor more than a month, from 28\u0026nbsp;August through 30\u0026nbsp;September 2026, the public was invited to vote for up to three of the unrealised project ideas of \u003ci\u003eWhat If Berlin\u003c/i\u003e that Akira Takayama has reimagined for the future.\u003c/p\u003e\u003cp\u003eDrawing on six thematic guided tours as well as additional information provided on this website, What If Berlin asked both long-time and newly arrived Berliners: Which of the 27\u0026nbsp;future visions are the most inspiring? Which projects does Berlin need for its future? And which idea should actually be realised?\u003c/p\u003e\u003cp\u003eThe results are now in: The project that received the most votes was the \u003ca href=\"${link:{uuid:{98c04e6c-e56d-45ca-83bf-dd968b909d29},repository:{website},provider:{jcr},path:{/bfs-de/what-if-berlin/die-projekte/treptower-park}}}\"\u003eCentral Learning and Memorial Site \u003c/a\u003ewith 14\u0026nbsp;% of all votes cast. Second place, receiving 10\u0026nbsp;% of all votes cast, is \u003ca href=\"${link:{uuid:{6af0e7bc-7e84-4e4c-ab66-99c0bda0a457},repository:{website},provider:{jcr},path:{/bfs-de/what-if-berlin/die-projekte/suedkreuz}}}\"\u003eLili Elbe Archive\u003c/a\u003e. Third place went to \u003ca href=\"${link:{uuid:{d86c7f01-665e-4c5f-90e6-4897407c48e5},repository:{website},provider:{jcr},path:{/bfs-de/what-if-berlin/die-projekte/frankfurter-allee}}}\"\u003eWomen in Berlin\u003c/a\u003e, which received 9\u0026nbsp;% of all votes cast.\u003c/p\u003e17:T1cec,\u003cp\u003eThe immediacy that characterises the practice of performing arts is a mechanism for activating a community’s collective imagination and emotion, and its origins can likely be traced back to songs and dances praying for harvests. There, mythical narratives unfolded, ritualistic forms became established as local festivals, and were passed down continuously across generations. In other words, myths and rituals can also be said to be the origins of performing arts. Now, let us ask ourselves anew: Can contemporary performing arts serve not as something that divides us living in the modern world, but as something that connects us? And can they inspire a sense of awe and reverence for life and its dignity? It is by returning to this fundamental meaning of performing arts that this 2026/27 Performing Arts Season has been conceived.\u003c/p\u003e\u003ch3\u003eProgramme\u003c/h3\u003e\u003cp\u003eWe open the fourth Performing Arts Season on 13 October with a bold new performance work: the stage version of \u003ca href=\"${link:{uuid:{c9197019-0240-4d93-9716-a043bce5ed89},repository:{website},path:{/bfs-de/performing-arts-season/programm/2026/spielplan/balkan-erotic-epic}}}\"\u003e\u003ci\u003eBalkan Erotic Epic\u003c/i\u003e\u003c/a\u003e by the seminal iconic performance artist, \u003cstrong\u003eMarina Abramović\u003c/strong\u003e, will premiere in Germany. This durational ritual where ancient Balkan myths meet performance art explores until 17 October the eroticism, spirituality and traditions of Abramović’s homeland, brought to life by a cast of more than 30 performers, dancers, musicians and singers.\u003c/p\u003e\u003cp\u003eFollowing on 12 and 13 November, Albanian-born Greek-based theatre maker \u003cstrong\u003eMario Banushi\u003c/strong\u003e returns to Haus der Berliner Festspiele after being part of the festival Performing Exiles in 2025. Banushi shows his latest piece, \u003ca href=\"${link:{uuid:{8fb75f64-3c3c-4b1d-bd79-1c512037dc07},repository:{website},path:{/bfs-de/performing-arts-season/programm/2026/spielplan/mami}}}\"\u003e\u003ci\u003eMAMI\u003c/i\u003e\u003c/a\u003e, as its German premiere. As his personal mythology, this work, a visual poem and a landscape of memories, depicts the source of life and is a tribute to the women who nurtured us.\u003c/p\u003e\u003cp\u003eWhat is more, \u003cstrong\u003eAnne Teresa De Keersmaeker\u003c/strong\u003e returns to her roots with the new creation \u003ca href=\"${link:{uuid:{54721d11-c997-4ba6-aa99-6c23f8c72256},repository:{website},path:{/bfs-de/performing-arts-season/programm/2026/spielplan/gla55}}}\"\u003e\u003ci\u003eGLA55\u003c/i\u003e\u003c/a\u003e, which will have its world premiere at the Haus der Berliner Festspiele on 19 November, with further performances on 20 and 21 November. The Ictus Ensemble and Bl!ndman revisit early works by the master of minimalism, \u003cstrong\u003ePhilip Glass\u003c/strong\u003e, while \u003ci\u003eRosas \u003c/i\u003edancers let a geometric choreography unfold, guiding our consciousness into a trance-like dimension.\u003c/p\u003e\u003cp\u003eIn December, you can see two bold dance pieces. Belgian-French choreographer \u003cstrong\u003eDamien Jalet\u003c/strong\u003e brings \u003ca href=\"${link:{uuid:{d9ad803f-6ba0-4b68-8ce7-888510117e5b},repository:{website},path:{/bfs-de/performing-arts-season/programm/2026/spielplan/planet-wanderer}}}\"\u003e\u003ci\u003ePlanet [wanderer]\u003c/i\u003e\u003c/a\u003e on 4 and 5 December, inspired by Japan’s Genesis story, the \u003ci\u003eKojiki\u003c/i\u003e. Alongside the overwhelming organic stage set by the Japanese sculptor, \u003cstrong\u003eKohei Nawa\u003c/strong\u003e, it discusses the boundary between the living and the dead, and the inseparable relationship between the human body, the elements of the cosmic world, and gravity. This work has been incorporated into the \u003ca href=\"${link:{uuid:{0baff744-855c-4466-9836-95d5e477c90c},repository:{website},path:{/bfs-de/programm/2026/focus-japan}}}\"\u003eFocus Japan\u003c/a\u003e framework initiated by Berliner Festspiele in 2026, symbolising the long-standing exchange and resonance between the Berliner Festspiele and Japanese forms of artistic expression.\u003c/p\u003e\u003cp\u003eCanadian leading choreographer, \u003cstrong\u003eMarie Chouinard\u003c/strong\u003e, on the other hand, highlights on 9 and 10 December an evening consisting of her early masterpiece (1993) and her latest piece (2025): \u003ca href=\"${link:{uuid:{be3666ea-4184-4c7d-8ac5-d96e2a3936d7},repository:{website},path:{/bfs-de/performing-arts-season/programm/2026/spielplan/magnificat-the-rite-of-spring}}}\"\u003e\u003ci\u003eThe Rite of Spring\u003c/i\u003e\u003c/a\u003e, a piece of music that has inspired legendary artists to create groundbreaking choreographies in each epoch, and \u003ca href=\"${link:{uuid:{be3666ea-4184-4c7d-8ac5-d96e2a3936d7},repository:{website},path:{/bfs-de/performing-arts-season/programm/2026/spielplan/magnificat-the-rite-of-spring}}}\"\u003e\u003ci\u003eMAGNIFICAT\u003c/i\u003e\u003c/a\u003e, which is one of the eight most ancient Christian hymns and is the canticle most frequently recited. What defines both works is that they are subject to her sublime and exquisite choreography.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eDumb Type\u003c/strong\u003e, Japan’s leading multimedia performance collective, presents their latest performance work, \u003ca href=\"${link:{uuid:{95bbcecf-aada-4647-8dd1-616c77c20751},repository:{website},path:{/bfs-de/performing-arts-season/programm/2026/spielplan/2020}}}\"\u003e\u003ci\u003e2020\u003c/i\u003e\u003c/a\u003e\u003ci\u003e,\u003c/i\u003e from 15 to 17 January. This has been a phantom work, which they almost completed and planned to premiere in March 2020 as the first work after 18\u0026nbsp;years but was cancelled due to the COVID-19 pandemic; only a recorded version was presented. Berliner Festspiele present the European premiere in January 2027 right after the now live world premiere at ROHM Theatre Kyoto. AI, surveillance society, communication failure, the climate crisis, geopolitics – the performance explores these threats to humanity in the liminal space between technology and the living body. This work is also part of \u003ca href=\"${link:{uuid:{0baff744-855c-4466-9836-95d5e477c90c},repository:{website},path:{/bfs-de/programm/2026/focus-japan}}}\"\u003eFocus Japan\u003c/a\u003e, initiated by Berliner Festspiele\u003c/p\u003e\u003cp\u003eAfter being a part of the 2025/26 Performing Arts Season and being nominated for the 2024 Theatertreffen, we are pleased to welcome again Franco-Austrian artist, choreographer and director \u003cstrong\u003eGisèle Vienne\u003c/strong\u003e on 21 and 22 January with her new creation and Berliner Festspiele co-production, \u003ca href=\"${link:{uuid:{2b7c6f56-4004-4b5f-a1b1-9d6f1f21002d},repository:{website},path:{/bfs-de/performing-arts-season/programm/2026/spielplan/archives-of-feelings}}}\"\u003e\u003ci\u003eArchives of Feelings\u003c/i\u003e\u003c/a\u003e (world premiere at Schauspielhaus Z\u0026uuml;rich). In this first collaboration with the writer \u003cstrong\u003eMarie NDiaye\u003c/strong\u003e, Vienne articulates the contemporary concerns and the struggles for a dignified and viable life for all, embodying the long-standing research into power relations and their construction.\u003c/p\u003e\u003cp\u003eThrough these prominent contemporary expressions of performing arts and while bringing back to mind fundamental meanings of performativity, we might find that the performing arts exist as neither mere entertaining nor healing, but as a device that shapes our profound perception and thinking about the world, and furthermore, generates and changes it. The theatre has been over time and will continue to be an actual space: a place for people to come together. At the same time, the experience of theatre is a phenomenon that cannot be repeated and exists only in the here and now. Let’s share this unique time together and encounter different people and perspectives in the upcoming edition of the Performing Arts Season, which coincides with the Berliner Festspiele’s 75th anniversary year.\u003c/p\u003e18:T801,\u003cp\u003eCultural pluralism is not a new phenomenon; it has long existed within peoples, nations and communities. Even in prehistoric times, humans moved in search of food, water and shelter. Their migration patterns were influenced by climate, resource availability and interactions, later driven by imperialism and economic ambitions. The resulting cohabitation and collective behaviours, along with the languages, gestures and cultural heritage shared and exchanged, have continually shaped people’s identities as well as nations and communities, not seldom at a devastating cost. While this multidimensional diversity and plurality of identities has always been a part of human history, contemporary global homogenisation now poses significant challenges to traditions, local languages and cultural heritage. This, in turn, leads many regions and countries to witness the resurgence of rigid, stereotypical and essentialist concepts of identity. Against the backdrop of these developments, the Performing Arts Season 2025/26 will bring together works that interrogate binaries and singular, unrelated identities, reflecting the interconnectedness of the world and the self in its totality – what Édouard Glissant termed the “Whole-World” (Tout-monde).\u003c/p\u003e\u003cp\u003eParaphrasing these conceptions of identity through the lens of the performing arts as an ephemeral phenomenon rooted in negotiation and relationships, this third Performing Arts Season edition presents a selection of dance, theatre and performance works that discard the idea of a majority-minority-society which often ascribes non-European artists to a certain minority status. The pieces created by Eun-Me Ahn, Gisèle Vienne and Étienne Bideau-Rey, William Kentridge, Akram Khan Company, Nina Laisné, François Chaignaud and Nadia Larcher, Thorsten Lensing and Ligia Lewis delve into themes such as the precarity of identity, displacement, creolisation and transnationality, highlighting the power of performance to navigate and articulate our shared yet diverse experiences.\u003c/p\u003e19:Tac2,\u003cp\u003e\u003ci\u003eMAMI\u003c/i\u003e  revolves around a word that means more than a person. Mother – in Mario Banushi’s work this word signifies origin and absence at once, care and burden, closeness and loss. \u003cspan lang=\"EN-US\" dir=\"ltr\"\u003eThe director and performer was born in Greece\u0026nbsp;but spent part of his early childhood in Albania with his grandmother – a common practice at the time, particularly in large families, due to economic hardship – before returning to Greece at the age of six.\u0026nbsp;In his latest creation, Banushi condenses personal memories into a poetic exploration of the relationships that bring life into being and shape it. \u003c/span\u003e\u003ci\u003eMAMI\u003c/i\u003e  i\u003cspan lang=\"EN-US\" dir=\"ltr\"\u003es a tribute to the women who raised us – and to the ambivalences bound up with this inheritance.\u003c/span\u003e\u003c/p\u003e\u003cp\u003eDrawing on his own experiences, Banushi creates a form of visual theatre of memory. The stage becomes a space of remembrance, familiar and uncanny at the same time. In silent, highly concentrated images, a chronicle of growing up unfolds – from early imprints of childhood through first experiences of love to the discovery of one’s own desire. Tenderness and loss, birth and impermanence, care and separation exist in a constant state of tension. Time appears stretched, suspended, as if following the inner logic of memory rather than a linear narrative.\u003c/p\u003e\u003cp\u003eA defining feature of Banushi’s work is the absence of spoken language. Bodies, gestures, music, light and colour carry the narrative. His productions emerge from an intense visual process and function like immaterial books that ask to be experienced rather than read. His stage spaces resemble estranged in-between worlds in which reality and symbolism imperceptibly merge. Rituals, offerings and everyday materials combine to form a poetics of the real, in which bodies, in their raw and unprotected presence, become images of striking emotional clarity. The music, strongly influenced by the Balkans, reinforces the ritual dimension of the performance, lending it an archaic yet contemporary quality.\u003c/p\u003e\u003cp\u003eMario Banushi has gained international recognition for his wordless, visually powerful theatre works, for which he was awarded the Silver Lion at the Venice Biennale in 2026. With his debut \u003ci\u003eRagada\u003c/i\u003e and the subsequent productions \u003ci\u003eGoodbye, Lindita\u003c/i\u003e and \u003ci\u003eTaverna Miresia – Mario Bella Anastasia\u003c/i\u003e, he developed a distinctive form of visual theatre in which personal experience, ritual and collective memory intertwine. With \u003ci\u003eMAMI\u003c/i\u003e, he continues this artistic trajectory, turning – after works shaped by farewell and mourning – towards life itself: towards birth, transmission, and the question of who carries whom, and at what cost.\u003c/p\u003e1a:Tbff,\u003cp\u003e\u003ca href=\"${link:{uuid:{1349cdd2-f016-4593-9834-9a48fee9f175},repository:{artists},path:{/bfs-mediathek/B/mario-banushi}}}\"\u003e\u003cspan class=\"cast-name\"\u003eMario Banushi\u003c/span\u003e\u003c/a\u003e –\u003cspan class=\"cast-info\"\u003e Concept, Director\u003c/span\u003e \u003cbr\u003e \u003cspan class=\"cast-name\"\u003eVasiliki Driva, Dimitris Lagos, Eftychia Stefanou, Angeliki Stellatou, Ennea Vangelis, Panagiota Υiagli\u0026nbsp; \u003c/span\u003e–\u003cspan class=\"cast-info\"\u003e Performance\u003c/span\u003e \u003cbr\u003e \u003cspan class=\"cast-name\"\u003eSotiris Melanos\u003c/span\u003e –\u003cspan class=\"cast-info\"\u003e Set and Costume Design\u003c/span\u003e \u003cbr\u003e \u003cspan class=\"cast-name\"\u003eJeph Vanger\u003c/span\u003e –\u003cspan class=\"cast-info\"\u003e Original Music and Sound Design\u003c/span\u003e \u003cbr\u003e \u003cspan class=\"cast-name\"\u003eStephanos Droussiotis\u003c/span\u003e –\u003cspan class=\"cast-info\"\u003e Lighting Design, Associate Dramaturg\u003c/span\u003e \u003cbr\u003e \u003cspan class=\"cast-name\"\u003eAimilios Arapoglou\u003c/span\u003e, \u003cspan class=\"cast-name\"\u003eThanasis Deligiannis\u003c/span\u003e –\u003cspan class=\"cast-info\"\u003e Artistic Collaborators\u003c/span\u003e \u003cbr\u003e \u003cspan class=\"cast-name\"\u003eTheodora Patiti\u003c/span\u003e –\u003cspan class=\"cast-info\"\u003e Assistant Director\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan class=\"cast-name\"\u003eNikos Mavrakis\u003c/span\u003e –\u003cspan class=\"cast-info\"\u003e International Relations, Tour Management\u003c/span\u003e \u003cbr\u003e \u003cspan class=\"cast-name\"\u003eRena Andreadaki\u003c/span\u003e \u0026amp; \u003cspan class=\"cast-name\"\u003eChristos Christopoulos (TooFarEast)\u003c/span\u003e –\u003cspan class=\  Bau presents the most comprehensive exhibition of her work to date. Featuring 454\u0026nbsp;prints, many of them shown here for the first time, Konstellationen offers new perspectives on Arbus’ iconic images and the wide range of her portraiture.\u003c/p\u003e\",\"mgnl:created\":\"2026-03-06T06:59:38.001Z\",\"topLine\":\"\u003cp\u003eExhibition\u003c/p\u003e\\n\",\"title\":\"\u003cp\u003eDiane Arbus: Konstellationen\u003c/p\u003e\",\"variableAspectRatio\":true,\"mgnl:lastModified\":\"2026-03-06T06:59:38.001Z\",\"image\":{\"@name\":\"gb25_diane_arbus_lady_bartender_at_home_with_a_souvenir dog_new_orleans_la_1964\",\"@path\":\"/bfs-de/Gropius-Bau/2025/gb25_diane_arbus/gb25_diane_arbus_key_visual/gb25_diane_arbus_lady_bartender_at_home_with_a_souvenir-dog_new_orleans_la_1964.jpg\",\"@id\":\"jcr:3c2afc08-6b3d-4a31-92e4-b0d2d06e12c2\",\"@link\":\"/magnoliaPublic/dam/jcr:3c2afc08-6b3d-4a31-92e4-b0d2d06e12c2/gb25_diane_arbus_key_visual_kein_rahmen.124a48d4fdfaa0abdf0589b2669715f7.jpg\",\"metadata\":{\"fileName\":\"gb25_diane_arbus_key_visual_kein_rahmen.jpg\",\"mimeType\":\"image/jpeg\",\"caption\":\"Diane Arbus, Lady bartender at home with a souvenir dog, New Orleans, La. 1964\",\"fileSize\":4335867,\"height\":2992,\"width\":3000,\"title\":\"Diane Arbus, Lady bartender at home with a souvenir dog, New Orleans, La. 1964\",\"format\":\"image/jpeg\",\"description\":\"A person is sitting on a chair with her legs crossed. Next to the person is a shelf with an artificial souvenir dog on top.\",\"rights\":\"© The Estate of Diane Arbus, Collection Maja Hoffmann/LUMA Foundation\",\"creator\":[\"Leonie.Recksiek\"],\"date\":\"2025-08-18T13:13:36.855Z\",\"created\":\"2025-07-30T10:59:41.805Z\",\"modified\":\"2025-08-18T13:13:36.855Z\"},\"renditions\":{\"mini\":{\"mimeType\":\"image/jpeg\",\"link\":\"/magnoliaPublic/.imaging/mte/bfs-de-fe/mini/dam/bfs-de/Gropius-Bau/2025/gb25_diane_arbus/gb25_diane_arbus_key_visual/gb25_diane_arbus_lady_bartender_at_home_with_a_souvenir-dog_new_orlea ode\",\"text\":\"\u003cp\u003e9 October 2026 to 17 January 2027\u003c/p\u003e\u003cp\u003eOver the course of his artistic career, Christoph Schlingensief (1960–2010) relentlessly confronted the absurdities of the present. The exhibition \u003ci\u003eEs ist nicht mehr mein Problem, macht eure Schei\u0026szlig;e alleine\u003c/i\u003e (It’s not my problem anymore, deal with your own shit) at Gropius Bau sheds light on his visionary, genre-defying body of work, ranging from striking political actions to projects spanning theatre, opera, film and the visual arts.\u003c/p\u003e\u003cp\u003e \u003cbr\u003e \u0026nbsp;\u003c/p\u003e\",\"topline\":\"\u003cp\u003eExhibition\u003c/p\u003e\",\"mgnl:created\":\"2026-10-09T15:23:32.127Z\",\"title\":\"\u003cp\u003eChristoph Schlingensief: Es ist nicht mehr mein Problem, macht eure Schei\u0026szlig;e alleine\u003c/p\u003e\",\"mgnl:lastModified\":\"2026-10-09T15:24:51.488Z\",\"image\":{\"@name\":\"gb26_schlingensief_motiv_3zu2\",\"@path\":\"/bfs-de/Gropius-Bau/2026/gb26_christoph_schlingensief/gb26_schlingensief_motiv_3zu2.jpg\",\"@id\":\"jcr:ac253497-ee3b-4f32-9b1a-75ba81f2d1b9\",\"@link\":\"/magnoliaPublic/dam/jcr:ac253497-ee3b-4f32-9b1a-75ba81f2d1b9/gb26_schlingensief_motiv_3zu2.21471eb9a25034299ac22ca6ad791f8c.jpg\",\"metadata\":{\"fileName\":\"gb26_schlingensief_motiv_3zu2.jpg\",\"mimeType\":\"image/jpeg\",\"fileSize\":304449,\"height\":1000,\"width\":1500,\"format\":\"image/jpeg\",\"description\":\"Handwritten white text on black background: Es ist nicht mehr mein Problem! Macht eure Scheiße alleine.\",\"rights\":\"© The Estate of Christoph Schlingensief\",\"source\":\"Christoph Schlingensief: Es ist nicht mehr mein Problem, macht eure Scheiße alleine\",\"creator\":[\"superuser\"],\"date\":\"2026-09-21T15:37:17.285Z\",\"created\":\"2026-09-21T15:37:17.037Z\",\"modified\":\"2026-09-21T15:37:17.285Z\"},\"renditions\":{\"mini\":{\"mimeType\":\"image/jpeg\",\"link\":\"/magnoliaPublic/.imaging/mte/bfs-de-fe/mini/dam/bfs-de/Gropius- 3e\u003c/p\u003e\u003cp\u003e\u003cspan\u003eNowhere were the social and cultural changes of 1960s and 1970s West Germany more powerfully manifest than in Berlin’s Kreuzberg neighbourhood.\u003c/span\u003e \u003cbr\u003e \u003cspan lang=\\\"EN-US\\\" dir=\\\"ltr\\\"\u003eThe group exhibition focuses on the diverse and largely overlooked cultural production on the topic of labour migration and on how artists in the neighbourhood have responded to the tensions and issues of their time.\u003c/span\u003e\u003c/p\u003e\",\"topline\":\"\u003cp\u003eExhibition\u003c/p\u003e\",\"mgnl:created\":\"2026-08-31T07:51:03.259Z\",\"title\":\"\u003cp\u003eKreuzberg: Kunst und Migration seit 1960\u003c/p\u003e\",\"image\":{\"@name\":\"gb26_vlassis_caniaris_kind_quadrat\",\"@path\":\"/bfs-de/Gropius-Bau/2026/gb26_kreuzberg/gb26_vlassis_caniaris_kind_quadrat.jpg\",\"@id\":\"jcr:56097124-f27e-4da0-a564-8d33d80d0184\",\"@link\":\"/magnoliaPublic/dam/jcr:56097124-f27e-4da0-a564-8d33d80d0184/gb26_vlassis_caniaris_kind_quadrat.38c837890b488b4981482174213bb251.jpg\",\"metadata\":{\"fileName\":\"gb26_vlassis_caniaris_kind_quadrat.jpg\",\"mimeType\":\"image/jpeg\",\"caption\":\"Vlassis Caniaris, Kind, 1980, collection of the Museum of Modern Art in Warsaw, courtesy: the Estate of Vlassis Caniaris and Galerie Peter Kilchmann, Zurich/Paris\",\"fileSize\":80260,\"height\":1080,\"width\":1080,\"format\":\"image/jpeg\",\"description\":\"A figure wearing a knitted jumper on a red tricycle, holding a yellow and green pinwheel in one hand.\",\"rights\":\"© The Estate of Vlassis Caniaris, photo: Sebastian Schaub\",\"creator\":[\"superuser\"],\"date\":\"2026-07-30T10:11:50.872Z\",\"created\":\"2026-07-30T10:11:50.721Z\",\"modified\":\"2026-07-30T10:11:50.872Z\"},\"renditions\":{\"mini\":{\"mimeType\":\"image/jpeg\",\"link\":\"/magnoliaPublic/.imaging/mte/bfs-de-fe/mini/dam/bfs-de/Gropius-Bau/2026/gb26_kreuzberg/gb26_vlassis_caniaris_kind_quadrat.jpg/jcr:content/gb26_vlassis_caniaris_kind_quadrat.jpg\"}, "/bfs-de/main/0110/teasers/teasers0\",\"@id\":\"1ee68799-9ef7-488f-a808-e88fa38f3242\",\"@nodeType\":\"mgnl:contentNode\",\"text\":\"\u003cp\u003e\u003cspan\u003eIn 2026 the Berliner Festspiele celebrate their 75th anniversary. A selection of events programmed throughout the entire year engage take the anniversary as their theme or mark the occasion with works at the Haus der Berliner Festspiele, the Gropius Bau, the Philharmonie, on Berlin’s Ringbahn and at other locations in the city. Outstanding international that liberal societies and their cultural institutions face in a new, multipolar world order. artists such as Marina Abramović, Gabriele St\u0026ouml;tzer and Akira Takayama will set the agenda both thematically and aesthetically. Entitled \u003c/span\u003e\u003ci\u003e\u003cspan\u003e“Die gro\u0026szlig;e Unordnung” (The Great Disorder)\u003c/span\u003e\u003c/i\u003e\u003cspan\u003e, the four-day focus Reflexes \u0026amp; Reflections will also enquire about the challenges.\u003c/span\u003e\u003c/p\u003e\",\"mgnl:created\":\"2026-10-09T15:15:50.463Z\",\"variableAspectRatio\":false,\"topLine\":\"\u003cp\u003e\u003cspan\u003eAnniversary\u003c/span\u003e\u003c/p\u003e\",\"title\":\"\u003cp\u003e75 Years of the Berliner Festspiele\u003c/p\u003e\",\"mgnl:lastModified\":\"2026-10-09T15:15:50.463Z\",\"image\":{\"@name\":\"bfs26_jubiläum_plakat_stoetzer\",\"@path\":\"/bfs-de/Berliner-Festspiele/2026/Jubilaeum-75-Jahre-Berliner-Festspiele/Bilder/bfs26_jubilaeum_plakat_stoetzer.jpeg\",\"@id\":\"jcr:0e3b684b-e7df-48e4-bf3d-d4b42aef0778\",\"@link\":\"/magnoliaPublic/dam/jcr:0e3b684b-e7df-48e4-bf3d-d4b42aef0778/bfs26_plakat_gabriele_stoetzer.04df2a06d2bd80867196368b9780aaf2.jpg\",\"metadata\":{\"fileName\":\"bfs26_plakat_gabriele_stoetzer.jpg\",\"mimeType\":\"image/jpeg\",\"caption\":\"Gabriele Stötzer, Brückenbegegnung, Linz 2025\",\"fileSize\":7254256,\"height\":3000,\"width\":2122,\"title\":\"Brückenbegegnung\",\"format\":\"image/jpeg\",\"description\":\"Colourful abs jpeg\",\"link\":\"/magnoliaPublic/.imaging/mte/bfs-de-fe/large/dam/bfs-de/Theatertreffen/jahresuebergreifend/Header/tt23_seitenbild_blog_header.jpg/jcr:content/tt24_ueber_tt_blog.jpg\"},\"meta\":{\"mimeType\":\"image/jpeg\",\"link\":\"/magnoliaPublic/.imaging/mte/bfs-de-fe/meta/dam/bfs-de/Theatertreffen/jahresuebergreifend/Header/tt23_seitenbild_blog_header.jpg/jcr:content/tt24_ueber_tt_blog.jpg\"}},\"name\":\"Theatertreffen-Blog Header\",\"path\":\"/bfs-de/Theatertreffen/jahresuebergreifend/Header/tt23_seitenbild_blog_header.jpg\",\"id\":\"jcr:f272f75a-bd82-44a0-8eab-01e5cc7cc325\",\"link\":\"/magnoliaPublic/dam/jcr:f272f75a-bd82-44a0-8eab-01e5cc7cc325/tt24_ueber_tt_blog.c66eb929f15056776b6806908462821e.jpg\"},\"isHeaderAlignedWithMedia\":true,\"showSoundToggle\":false,\"topline\":\"Anniversary\",\"inheritBgColorFromPageColor\":false,\"divider\":false,\"mgnl:created\":\"2026-07-30T08:30:25.976Z\",\"hideImageDetails\":false,\"isVideoSoundOn\":false,\"variableAspectRatio\":true,\"title\":\"75 Years of the Berliner Festspiele\",\"startDate\":\"2026-08-28T00:00:00.000+02:00\",\"text\":\"\u003cp\u003eIn 2026 the Berliner Festspiele celebrate their 75th anniversary. A selection of events programmed throughout the entire year engage take the anniversary as their theme or mark the occasion with works at the Haus der Berliner Festspiele, the Gropius Bau, the Philharmonie, on Berlin’s Ringbahn and at other locations in the city. Outstanding international that liberal societies and their cultural institutions face in a new, multipolar world order. artists such as Marina Abramović, Gabriele St\u0026ouml;tzer and Akira Takayama will set the agenda both thematically and aesthetically. Entitled \u003ci\u003e“Die gro\u0026szlig;e Unordnung” (The Great Disorder)\u003c/i\u003e, the four-day focus Reflexes \u0026amp; Reflections will also enquire about the challenges.\u003c/p\u003e\",\"isGapAfterComponentReduced\":false,\"isVideoPaused\":false,\"hideMediaDetails\":true,\"mgnl:templat plate\":\"bfs-de-fe:components/magnolia/TextMediaModule/TextMediaModule\",\"mgnl_lastModified\":\"2026-08-31T10:51:00.320Z\",\"nodes\":[\"cta\",\"visibility\",\"smartInfo\",\"ctas\"]},\"04\":{\"@name\":\"04\",\"@path\":\"/bfs-de/main/04\",\"@id\":\"f160e3ae-fd85-4b5e-8ec1-c7e91c70b160\",\"@nodeType\":\"mgnl:component\",\"text\":\"\u003cp\u003e\u003cspan\u003eAs part of the \u003c/span\u003e\u003ca href=\\\"${link:{uuid:{2c0967b0-df39-4434-9172-4a4def78648d},repository:{website},provider:{jcr},path:{/bfs-de/programm/2026/75-jahre-berliner-festspiele}}}\\\"\u003e75th anniversary of the Berlin Festspiele\u003c/a\u003e\u003cspan\u003e, Japanese theatre artist Akira Takayama invited audiences with \u003c/span\u003e\u003ci\u003eWhat If Berlin\u003c/i\u003e\u003cspan\u003e to embark on tours led by 27\u003c/span\u003e\u0026nbsp;\u003cspan\u003eguides aboard the Ringbahn. Over four weekends, more than 3,000 visitors took part in over 350\u003c/span\u003e\u0026nbsp;\u003cspan\u003etours covering all 27\u003c/span\u003e\u0026nbsp;\u003cspan\u003eRingbahn stations, exploring alternative visions of Berlin’s future. In the audience vote that followed, he asked participants to decide which of the projects he had presented would be most needed in Berlin’s future, and which of the proposals deserved to be realised. The public vote ultimately named the \u003c/span\u003eCentral Site of Learning and Remembrance\u003cspan\u003e\u0026nbsp;at Treptower Park S-Bahn station as the audience’s favourite project.\u003c/span\u003e\u003c/p\u003e\",\"isHeaderAlignedWithMedia\":true,\"inheritBgColorFromPageColor\":false,\"mgnl:template\":\"bfs-de-fe:components/magnolia/TextMediaModule/TextMediaModule\",\"subtitle\":\"27 Stations on the Ringbahn\",\"divider\":false,\"mgnl:created\":\"2026-09-30T07:16:05.206Z\",\"hideImageDetails\":true,\"variableAspectRatio\":false,\"variant\":\"MediaOneThird\",\"title\":\"What If Berlin\",\"image\":{\"@name\":\"bfs26_ringbahn_mit_stationen\",\"@path\":\"/bfs-de/B iberal societies and their cultural institutions face in a new, multipolar world order. artists such as Marina Abramović, Gabriele St\u0026ouml;tzer and Akira Takayama will set the agenda both thematically and aesthetically. Entitled \u003c/span\u003e\u003ci\u003e\u003cspan\u003e“Die gro\u0026szlig;e Unordnung” (The Great Disorder)\u003c/span\u003e\u003c/i\u003e\u003cspan\u003e, the four-day focus Reflexes \u0026amp; Reflections will also enquire about the challenges.\u003c/span\u003e\u003c/p\u003e\",\"mgnl:created\":\"2026-08-28T12:04:51.902Z\",\"variableAspectRatio\":false,\"topLine\":\"\u003cp\u003e\u003cspan\u003eAnniversary\u003c/span\u003e\u003c/p\u003e\",\"title\":\"\u003cp\u003e75 Years of the Berliner Festspiele\u003c/p\u003e\",\"mgnl:lastModified\":\"2026-09-15T12:01:48.553Z\",\"image\":{\"@name\":\"bfs26_jubiläum_plakat_stoetzer\",\"@path\":\"/bfs-de/Berliner-Festspiele/2026/Jubilaeum-75-Jahre-Berliner-Festspiele/Bilder/bfs26_jubilaeum_plakat_stoetzer.jpeg\",\"@id\":\"jcr:0e3b684b-e7df-48e4-bf3d-d4b42aef0778\",\"@link\":\"/magnoliaPublic/dam/jcr:0e3b684b-e7df-48e4-bf3d-d4b42aef0778/bfs26_plakat_gabriele_stoetzer.04df2a06d2bd80867196368b9780aaf2.jpg\",\"metadata\":{\"fileName\":\"bfs26_plakat_gabriele_stoetzer.jpg\",\"mimeType\":\"image/jpeg\",\"caption\":\"Gabriele Stötzer, Brückenbegegnung, Linz 2025\",\"fileSize\":7254256,\"height\":3000,\"width\":2122,\"title\":\"Brückenbegegnung\",\"format\":\"image/jpeg\",\"description\":\"Colourful abstract painting featuring two dynamically posed figures facing each other in bright, vivid tones.\",\"rights\":\"© VG Bild-Kunst, Bonn 2026\",\"source\":\"\u003cp\u003eEndbild Reihe 2\u003c/p\u003e\\n\",\"creator\":[\"superuser\"],\"date\":\"2026-10-02T08:13:49.945Z\",\"created\":\"2026-02-24T14:24:01.666Z\",\"modified\":\"2026-10-02T08:13:49.945Z\"},\"renditions\":{\"mini\":{\"mimeType\":\"image/jpeg\",\"link\":\"/magnoliaPublic/.imaging/mte/bfs-de-fe/mini/dam/bfs-de/Berliner-Festspiele/2026/Jubilaeum-75-Jahre-Berliner ama, Dumb Type and the Otomo Yoshihide New Jazz Quintet. Through contributions to the programmes of Musikfest Berlin, the Performing Arts Season, Jazzfest Berlin and MaerzMusik, alongside an original project unfolding across the city, this initiative draws on a long history of exchange and resonance between the Berliner Festspiele and artistic expressions of Japanese culture.\u003c/p\u003e\",\"isGapAfterComponentReduced\":false,\"isVideoPaused\":false,\"hideMediaDetails\":true,\"mgnl:template\":\"bfs-de-fe:components/magnolia/TextMediaModule/TextMediaModule\",\"variant\":\"MediaOneThird\",\"showLogo\":false,\"mgnl:lastModified\":\"2026-07-27T09:58:33.064Z\",\"endDate\":\"2026-08-30T00:00:00.000+02:00\",\"image\":{\"@name\":\"bfs26_focus_japan\",\"@path\":\"/bfs-de/Berliner-Festspiele/2026/Fokus-Japan/bfs26_focus_japan.jpg\",\"@id\":\"jcr:54423d52-739f-4475-94c3-1d1a49ae75ee\",\"@link\":\"/magnoliaPublic/dam/jcr:54423d52-739f-4475-94c3-1d1a49ae75ee/bfs26_Focus%20Japan_Keyvisual_c_Shiro%20Takatani_Dumb%20Type.644b87d0c96631c765f22c495d5d9692.jpg\",\"metadata\":{\"fileName\":\"bfs26_Focus Japan_Keyvisual_c_Shiro Takatani_Dumb Type.jpg\",\"mimeType\":\"image/jpeg\",\"caption\":\"Focus Japan\",\"fileSize\":709143,\"height\":2319,\"width\":4000,\"title\":\"Focus Japan, Keyvisual\",\"format\":\"image/jpeg\",\"description\":\"Cityscape with modern skyscrapers reflected in calm water, trees in the foreground.\",\"rights\":\"© Shiro Takatani / Dumb Type\",\"creator\":[\"Frank.Giesker\"],\"date\":\"2026-06-11T12:54:23.572Z\",\"created\":\"2026-05-28T09:55:16.173Z\",\"modified\":\"2026-06-11T12:54:23.572Z\"},\"renditions\":{\"mini\":{\"mimeType\":\"image/jpeg\",\"link\":\"/magnoliaPublic/.imaging/mte/bfs-de-fe/mini/dam/bfs-de/Berliner-Festspiele/2026/Fokus-Japan/bfs26_focus_japan.jpg/jcr:content/bfs26_Focus%20Japan_Keyvisual_c_Shiro%20Takatani_Dumb%20Type.jpg\"},\"small\":{\"mimeType\":\"image/jpeg\",\"link\":\"/magnoliaPublic/.imaging/mte/bfs-de-fe/small/dam/bfs-de/Berliner-Fe nt\",\"text\":\"\u003cp\u003eFrom October 2023, the Berliner Festspiele is to launch an annual Performing Arts Season that will present a panorama of international dance, theatre and performance productions on the stage of the Haus der Berliner Festspiele and the Gropius Bau through the autumn and winter months. Some of the works on display will be co-produced by the Berliner Festspiele or produced in Berlin. The Curator and Programme Director of the Berliner Festspiele’s Performing Arts Season is the dramaturg Yusuke Hashimoto.\u003c/p\u003e\",\"isHeaderAlignedWithMedia\":false,\"inheritBgColorFromPageColor\":false,\"mgnl:template\":\"bfs-de-fe:components/magnolia/TextMediaModule/TextMediaModule\",\"divider\":false,\"mgnl:created\":\"2024-02-27T14:11:02.967+01:00\",\"hideImageDetails\":false,\"variant\":\"MediaLeftHalf\",\"video\":{\"@name\":\"pas23_trailer\",\"@path\":\"/bfs-de/Performing-Arts-Season/2023/pas23_trailer\",\"@id\":\"cf19f787-0829-4ed1-944d-e971c44a9545\",\"@nodeType\":\"bfs:video\",\"languages\":[],\"name\":\"pas23_trailer\",\"showAvailableFromTime\":false,\"mgnl:created\":\"2023-08-14T16:28:47.526+02:00\",\"description\":\"Trailer Performing Arts Season 2023/2024, Design: 3pc\",\"title\":\"Trailer Performing Arts Season 2023/2024\",\"type\":\"fe68a97c-018e-4493-81df-4336042a3c2b\",\"showAvailableToTime\":false,\"copyrights\":\"© Berliner Festspiele / Performing Arts Season\",\"transcriptionRunning\":false,\"platform\":\"vimeo\",\"availableFrom\":\"2023-08-31T14:00:00.000+02:00\",\"aspectRatio\":\"169\",\"thumbnailImage\":{\"@name\":\"Teaser Performing Arts Season\",\"@path\":\"/bfs-de/Performing-Arts-Season/2023/Teaser-Performing-Arts-Season.png\",\"@id\":\"jcr:569f55bf-7659-4996-b543-509d92c107b2\",\"@link\":\"/magnoliaPublic/dam/jcr:569f55bf-7659-4996-b543-509d92c107b2/PAS23_Webvisual_3000X2000px.e825b7e61e33c892bc488517ac03d9d7.png\",\"metadata\":{\"fileName\":\"PAS23_Webvisual_3000X2000px.png\",\"mimeType\":\"image/png\",\"caption\":\"Performin
